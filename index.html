<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Welcome — mateuspinheiro.umbriel+3312354</title>
    <style>
      :root {
        --ink: #11131a;
        --ink-soft: #4a4f5c;
        --accent: #2d2bff;
        --paper: #f6f4ee;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        color: var(--ink);
        background: var(--paper);
        background-image:
          radial-gradient(1200px 700px at 12% -10%, rgba(45, 43, 255, 0.10), transparent 60%),
          radial-gradient(900px 600px at 95% 110%, rgba(255, 138, 76, 0.14), transparent 65%),
          linear-gradient(180deg, #faf8f2 0%, #efece4 100%);
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .frame {
        flex: 1;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1.25rem, 4vw, 2.5rem);
        gap: clamp(2rem, 6vw, 4rem);
      }

      header,
      footer {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      header .mark {
        color: var(--ink);
        font-weight: 600;
      }

      header .mark::before {
        content: "■ ";
        color: var(--accent);
      }

      main {
        max-width: 64rem;
        margin: 0 auto;
        padding: clamp(2rem, 8vw, 6rem) 0;
        width: 100%;
      }

      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin: 0 0 clamp(1.5rem, 4vw, 2.5rem) 0;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
      }

      .eyebrow::before {
        content: "";
        width: 2.25rem;
        height: 1px;
        background: currentColor;
        display: inline-block;
      }

      h1 {
        font-size: clamp(2.4rem, 7.5vw, 5.75rem);
        line-height: 1.02;
        letter-spacing: -0.025em;
        font-weight: 700;
        margin: 0;
      }

      h1 .handle {
        font-style: italic;
        font-weight: 500;
        color: var(--accent);
        white-space: nowrap;
      }

      .lede {
        margin: clamp(1.75rem, 4vw, 2.5rem) 0 0 0;
        max-width: 38rem;
        font-size: clamp(1.05rem, 1.6vw, 1.2rem);
        line-height: 1.6;
        color: var(--ink-soft);
      }

      footer .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }

      footer .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: #2bbf6c;
        box-shadow: 0 0 0 4px rgba(43, 191, 108, 0.16);
      }

      /* Mobile niceties */
      @media (max-width: 480px) {
        header,
        footer {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.5rem;
        }

        h1 .handle {
          white-space: normal;
          word-break: break-word;
        }
      }

      /* Reveal */
      .eyebrow,
      h1,
      .lede {
        opacity: 0;
        transform: translateY(8px);
        animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .eyebrow { animation-delay: 0.05s; }
      h1       { animation-delay: 0.18s; }
      .lede    { animation-delay: 0.34s; }

      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .eyebrow, h1, .lede {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <span class="mark">Machina</span>
        <span>Onboarding · v1</span>
      </header>

      <main>
        <p class="eyebrow">Workspace ready</p>
        <h1>
          Welcome to <span class="handle">mateuspinheiro.umbriel+3312354</span>’s workspace.
        </h1>
        <p class="lede">
          Your environment is provisioned and the first deploy is live. This page is a smoke
          test — proof that the pipeline from request to URL is open end&#8209;to&#8209;end.
        </p>
      </main>

      <footer>
        <span class="status"><span class="dot"></span> All systems nominal</span>
        <span>index.html · static</span>
      </footer>
    </div>
  </body>
</html>
