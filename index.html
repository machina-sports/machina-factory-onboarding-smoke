<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to FQA 2015</title>
  <style>
    :root {
      --ink: #15131a;
      --muted: #5c5668;
      --accent: #6d4aff;
      --bg-1: #f6f4ff;
      --bg-2: #fdf2f6;
      --bg-3: #eef6ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", Cambria, serif;
      color: var(--ink);
      background:
        radial-gradient(120% 120% at 15% 0%, var(--bg-1) 0%, transparent 55%),
        radial-gradient(120% 120% at 100% 20%, var(--bg-3) 0%, transparent 50%),
        radial-gradient(140% 140% at 50% 110%, var(--bg-2) 0%, transparent 60%),
        #fbfaff;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 44rem;
      width: 100%;
      text-align: left;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: clamp(0.7rem, 1.6vw, 0.8rem);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
    }

    h1 {
      font-size: clamp(2.75rem, 10vw, 6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
    }

    h1 .year {
      display: block;
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .rule {
      width: clamp(3rem, 8vw, 4.5rem);
      height: 2px;
      background: var(--accent);
      margin: clamp(2rem, 5vw, 2.75rem) 0 0;
      border-radius: 2px;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to<span class="year">FQA 2015</span></h1>
    <p class="lede">You're all set. This is the starting point — clean, quiet, and ready for what comes next.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
