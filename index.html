<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to worldcup</title>
  <style>
    :root {
      --ink: #11131a;
      --muted: #5b6172;
      --accent: #1a6b54;
      --line: rgba(17, 19, 26, 0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", "Iowan Old Style", serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 700px at 12% -10%, #eaf3ee 0%, rgba(234, 243, 238, 0) 55%),
        radial-gradient(900px 600px at 100% 110%, #f3eee6 0%, rgba(243, 238, 230, 0) 50%),
        linear-gradient(180deg, #fbfbf9 0%, #f4f5f2 100%);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 760px;
      text-align: left;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.25rem, 4vw, 2rem);
      animation-delay: 0.05s;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
    }

    .rule {
      height: 1px;
      background: var(--line);
      margin: clamp(2rem, 5vw, 3rem) 0 clamp(1.25rem, 3vw, 1.75rem);
    }

    .meta {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .fade { opacity: 0; animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .d1 { animation-delay: 0.12s; }
    .d2 { animation-delay: 0.24s; }
    .d3 { animation-delay: 0.36s; }
    .d4 { animation-delay: 0.48s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .fade { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow fade d1">Onboarding</p>
    <h1 class="fade d2">Welcome to <span class="accent">worldcup</span></h1>
    <p class="lede fade d3">You're all set. This is your starting point — clean, fast, and ready for whatever you build next.</p>
    <div class="rule fade d4"></div>
    <p class="meta fade d4">A Machina onboarding smoke test</p>
  </main>
</body>
</html>
