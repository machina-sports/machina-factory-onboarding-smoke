<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to FQA 2018</title>
  <style>
    :root {
      --ink: #14151a;
      --muted: #5b5f6b;
      --accent: #2f5bea;
      --line: rgba(20, 21, 26, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #eef2ff 0%, transparent 55%),
        radial-gradient(1000px 700px at 110% 120%, #fdeef2 0%, transparent 50%),
        linear-gradient(180deg, #ffffff 0%, #f7f8fb 100%);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      width: 100%;
      max-width: 680px;
      text-align: left;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.75rem;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.85rem;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.025em;
      margin-bottom: 1.5rem;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    h1 .light {
      font-style: italic;
      font-weight: 400;
      color: var(--muted);
    }

    .lede {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin: 2.75rem 0 1.5rem;
      animation: grow 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
      transform-origin: left center;
    }

    .foot {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="light">FQA</span> 2018</h1>
    <p class="lede">
      Everything is up and running. This is your starting point — clean,
      fast, and ready for whatever you build next.
    </p>
    <div class="rule"></div>
    <p class="foot">FQA &middot; 2018</p>
  </main>
</body>
</html>
