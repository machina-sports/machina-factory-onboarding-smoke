<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome — mateuspinheiro.umbriel+240196</title>
<style>
  :root {
    --ink: #11131a;
    --ink-soft: #4a4f5e;
    --rule: rgba(17, 19, 26, 0.12);
    --accent: #c2410c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: ui-serif, "Iowan Old Style", "Charter", "Georgia", "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 85% -10%, #ffe8d6 0%, rgba(255, 232, 214, 0) 60%),
      radial-gradient(900px 600px at 10% 110%, #e8e2d5 0%, rgba(232, 226, 213, 0) 55%),
      linear-gradient(180deg, #fbf8f1 0%, #f3ede0 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
  }

  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: clamp(28px, 5vw, 56px);
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: var(--ink);
  }

  .mark::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
  }

  .meta {
    display: flex;
    gap: 28px;
  }

  .meta span { white-space: nowrap; }

  main.hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(64px, 14vh, 160px) 0 clamp(48px, 10vh, 120px);
    max-width: 980px;
  }

  .eyebrow {
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 clamp(24px, 4vh, 40px);
  }

  h1 {
    margin: 0;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(40px, 7.4vw, 104px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--ink);
  }

  h1 .accent {
    font-style: normal;
    font-weight: 600;
    background: linear-gradient(120deg, #c2410c 0%, #9a3412 50%, #1f2937 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    word-break: break-word;
  }

  h1 .punct {
    color: var(--accent);
    font-style: normal;
  }

  .lede {
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: clamp(15px, 1.4vw, 18px);
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 56ch;
    margin: clamp(28px, 5vh, 48px) 0 0;
  }

  footer.bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .index {
    display: flex;
    gap: 28px;
  }

  @media (max-width: 600px) {
    .meta { display: none; }
    .index { gap: 18px; }
    footer.bottom { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="top">
      <span class="mark">Machina</span>
      <div class="meta">
        <span>Workspace</span>
        <span>Onboarding · 01</span>
      </div>
    </header>

    <main class="hero">
      <p class="eyebrow">A new workspace, ready</p>
      <h1>
        Welcome to <span class="accent">mateuspinheiro.umbriel+240196</span><span class="punct">’</span><span class="accent">s</span> workspace<span class="punct">.</span>
      </h1>
      <p class="lede">
        Everything is wired up and waiting. From here you can wire in connectors, draft workflows, and ship agents — the room is yours.
      </p>
    </main>

    <footer class="bottom">
      <span>Welcome screen</span>
      <div class="index">
        <span>Editorial</span>
        <span>v1.0</span>
      </div>
    </footer>
  </div>
</body>
</html>
