<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Thales</title>
  <style>
    :root {
      --ink: #14171f;
      --ink-soft: #5a6273;
      --accent: #3b4cff;
      --bg-a: #f6f7fb;
      --bg-b: #eef0f8;
      --bg-c: #e7ecff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% -10%, var(--bg-c) 0%, transparent 55%),
        radial-gradient(1000px 800px at 100% 110%, #f2e9ff 0%, transparent 50%),
        linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      overflow-x: hidden;
    }

    .stage {
      max-width: 720px;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      opacity: 0;
      animation: rise 0.8s ease-out 0.05s forwards;
    }

    .eyebrow::before {
      content: "";
      width: 42px;
      height: 1px;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: clamp(2.9rem, 9vw, 6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.9s ease-out 0.18s forwards;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.65;
      color: var(--ink-soft);
      max-width: 46ch;
      opacity: 0;
      animation: rise 0.9s ease-out 0.32s forwards;
    }

    .foot {
      margin-top: 3.25rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      opacity: 0;
      animation: rise 0.9s ease-out 0.46s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, p, .foot { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="eyebrow">Onboarding</div>
    <h1>Welcome to <span class="accent">Thales</span></h1>
    <p>Everything is set up and running. This is your starting point — clean, quiet, and ready for what comes next.</p>
    <div class="foot">Smoke test passed &middot; System nominal</div>
  </main>
</body>
</html>
