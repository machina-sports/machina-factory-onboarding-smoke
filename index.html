<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Jose's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6358;
      --accent: #b5532a;
      --line: rgba(20, 17, 15, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, #fcf7ef 0%, rgba(252, 247, 239, 0) 55%),
        radial-gradient(130% 120% at 92% 100%, #f0e6d6 0%, rgba(240, 230, 214, 0) 50%),
        linear-gradient(160deg, #faf4ea 0%, #f3ece0 100%);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      max-width: 64rem;
    }

    .eyebrow {
      font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: "";
      width: 2.5rem;
      height: 1px;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.75rem, 9vw, 7rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin: clamp(1.25rem, 3vw, 2rem) 0 0;
      max-width: 18ch;
    }

    h1 .line {
      display: block;
      opacity: 0;
      transform: translateY(0.6em);
      animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    h1 .line:nth-child(1) { animation-delay: 0.22s; }
    h1 .line:nth-child(2) { animation-delay: 0.34s; }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      margin-top: clamp(1.5rem, 3vw, 2.25rem);
      max-width: 46ch;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      opacity: 0;
      animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.5s forwards;
    }

    .meta {
      margin-top: clamp(2.5rem, 5vw, 4rem);
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 2rem;
      font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      opacity: 0;
      animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.65s forwards;
    }

    .meta span strong {
      color: var(--ink);
      font-weight: 600;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1 .line, p.lede, .meta {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <span class="eyebrow">Onboarding</span>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line"><em>Jose's</em> workspace</span>
    </h1>
    <p class="lede">
      Everything's wired up and ready. This is your starting point — a clean
      space to build, ship, and iterate.
    </p>
    <div class="meta">
      <span><strong>Status</strong> · Live</span>
      <span><strong>Environment</strong> · Workspace</span>
      <span><strong>Ready</strong> · Yes</span>
    </div>
  </main>
</body>
</html>
