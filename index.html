<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to builder billing test</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b625a;
      --accent: #b8532b;
      --paper: #f4efe8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 100% at 15% 0%, #fbf7f1 0%, var(--paper) 45%, #e8ddcf 100%);
      overflow-x: hidden;
    }

    .card {
      max-width: 46rem;
      width: 100%;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
      opacity: 0;
      animation: rise 0.7s ease-out 0.05s forwards;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5.75rem);
      line-height: 1.02;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: rise 0.8s ease-out 0.18s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: 3.5rem;
      height: 2px;
      background: var(--ink);
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.6s ease-out 0.5s forwards;
    }

    p {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.8s ease-out 0.62s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.25rem); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .rule, p { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding &middot; Smoke Test</p>
    <h1>Welcome to <em>builder billing test</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Everything is wired up and running. This minimal welcome screen confirms the build pipeline is healthy and ready to ship.</p>
  </main>
</body>
</html>
