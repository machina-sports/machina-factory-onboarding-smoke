<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to GERSON's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6560;
      --accent: #c2410c;
      --line: rgba(20, 17, 15, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #fbe9df 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 20%, #e8edf2 0%, transparent 50%),
        linear-gradient(180deg, #fdfcfb 0%, #f4f1ec 100%);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 8vh 24px;
    }

    .kicker {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      animation: rise 0.7s ease forwards;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 6.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      max-width: 16ch;
      opacity: 0;
      animation: rise 0.8s ease 0.12s forwards;
    }

    h1 .name {
      display: block;
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: 72px;
      height: 2px;
      background: var(--ink);
      margin: 40px 0 28px;
      transform: scaleX(0);
      transform-origin: left;
      animation: grow 0.8s ease 0.3s forwards;
    }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 48ch;
      opacity: 0;
      animation: rise 0.8s ease 0.42s forwards;
    }

    footer {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s ease 0.6s forwards;
    }

    footer .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    footer .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5);
      animation: pulse 2.4s ease-out infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .kicker, h1, .lede, footer { opacity: 1; }
      .rule { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="kicker">Workspace · Onboarding</p>
    <h1>Welcome to <span class="name">GERSON's</span> workspace</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">
      Everything's wired up and ready. This is your starting point — a quiet,
      uncluttered place to build, ship, and iterate.
    </p>
  </main>

  <footer>
    <span class="status"><span class="dot" aria-hidden="true"></span> Smoke test passed</span>
    <span>Machina · Ready</span>
  </footer>
</body>
</html>
