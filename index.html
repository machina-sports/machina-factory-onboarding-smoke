<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome to FQA 2007</title>
  <style>
    :root {
      --ink: #15130f;
      --ink-soft: #5c564c;
      --accent: #b4532a;
      --paper: #f6f2ea;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 15% 0%, #fdfbf6 0%, rgba(253,251,246,0) 55%),
        radial-gradient(130% 110% at 100% 100%, #efe6d6 0%, rgba(239,230,214,0) 60%),
        linear-gradient(160deg, #f8f4ec 0%, #efe8dc 100%);
      background-color: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      overflow-x: hidden;
    }

    .screen {
      width: 100%;
      max-width: 820px;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.7rem, 1.6vw, 0.82rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      animation: fade 900ms ease both;
      animation-delay: 120ms;
    }

    .title {
      font-size: clamp(2.8rem, 11vw, 7.5rem);
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
    }

    .title .line {
      display: block;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .title .line:nth-child(1) { animation-delay: 160ms; }
    .title .line:nth-child(2) { animation-delay: 280ms; }

    .title .em {
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: clamp(60px, 14vw, 120px);
      height: 2px;
      background: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      transform-origin: left;
      animation: grow 1000ms cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 420ms;
    }

    .lede {
      font-size: clamp(1.05rem, 2.6vw, 1.4rem);
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 48ch;
      animation: fade 900ms ease both;
      animation-delay: 520ms;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <p class="eyebrow">Onboarding</p>
    <h1 class="title">
      <span class="line">Welcome to</span>
      <span class="line em">FQA 2007</span>
    </h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">
      You&rsquo;re all set. This is a minimal onboarding smoke test &mdash;
      clean, fast, and ready to go.
    </p>
  </main>
</body>
</html>
