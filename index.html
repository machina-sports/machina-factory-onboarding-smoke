<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome to FQA 1001 Launch Test</title>
  <style>
    :root {
      --ink: #14131a;
      --ink-soft: #5a5766;
      --accent: #4b3bdb;
      --paper: #fbfaf7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 5rem);
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 700px at 15% -10%, rgba(75, 59, 219, 0.10), transparent 60%),
        radial-gradient(900px 600px at 95% 110%, rgba(219, 59, 130, 0.08), transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, #f3f0ea 100%);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 44rem;
      width: 100%;
      text-align: left;
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: clamp(1.25rem, 4vw, 2rem);
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.05s both;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.25rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 4vw, 2rem);
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.12s both;
    }

    h1 .accent {
      font-style: italic;
      background: linear-gradient(90deg, var(--accent), #db3b82);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 34rem;
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
    }

    .divider {
      width: 3.5rem;
      height: 3px;
      margin: clamp(1.75rem, 5vw, 2.75rem) 0;
      background: linear-gradient(90deg, var(--accent), #db3b82);
      border-radius: 999px;
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.16s both;
    }

    .foot {
      margin-top: clamp(2rem, 6vw, 3.5rem);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.28s both;
    }

    .foot .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2fb57a;
      margin-right: 0.5rem;
      vertical-align: middle;
      box-shadow: 0 0 0 0 rgba(47, 181, 122, 0.5);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(47, 181, 122, 0.45); }
      50%      { box-shadow: 0 0 0 6px rgba(47, 181, 122, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding &middot; Smoke Test</p>
    <h1>Welcome to <span class="accent">FQA&nbsp;1001</span> Launch Test</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="lede">
      If you can read this, the pipeline is live. A minimal, self-contained
      welcome screen &mdash; one file, no build step, no dependencies.
    </p>
    <p class="foot"><span class="dot" aria-hidden="true"></span>System online</p>
  </main>
</body>
</html>
