<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* CSS Reset & Variable Definitions */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-start: #fbfcff;
            --bg-end: #f4f6fc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.05);
            --border-color: rgba(15, 23, 42, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4rem 2rem;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hero / Content Section */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 48rem;
            width: 100%;
            text-align: center;
            margin: 4rem 0;
        }

        /* Subtle badge/indicator above the heading */
        .workspace-badge {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            background: var(--accent-glow);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            margin-bottom: 2rem;
            display: inline-block;
            border: 1px solid rgba(37, 99, 235, 0.15);
            animation: fadeInDown 0.8s ease-out;
        }

        /* Editorial Bold Heading */
        h1 {
            font-size: clamp(2.25rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            animation: fadeInUp 0.8s ease-out;
        }

        /* Editorial secondary paragraph */
        p {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 32rem;
            font-weight: 400;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
        }

        /* Decorative Minimal Divider */
        .divider {
            width: 3rem;
            height: 2px;
            background-color: var(--accent);
            opacity: 0.3;
            margin: 0 auto;
            animation: scaleIn 1.2s ease-out;
        }

        /* Footer Info */
        footer {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
            opacity: 0.6;
            animation: fadeIn 1.5s ease-out;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.6;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scaleX(0);
                opacity: 0;
            }
            to {
                transform: scaleX(1);
                opacity: 0.3;
            }
        }

        /* Responsiveness & Touch Target Safety */
        @media (max-width: 640px) {
            body {
                padding: 2rem 1.5rem;
            }
            main {
                margin: 2rem 0;
            }
        }
    </style>
</head>
<body>

    <main>
        <span class="workspace-badge">Active Environment</span>
        <h1>Welcome to pablog.sax+1420's workspace</h1>
        <p>Your workspace is fully provisioned and ready for development. This is a minimal onboarding smoke test to verify system integrity.</p>
        <div class="divider"></div>
    </main>

    <footer>
        Onboarding Smoke Test &bull; Machina Factory
    </footer>

</body>
</html>
