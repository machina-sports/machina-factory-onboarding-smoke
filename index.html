<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Factory Internal Projects</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b635c;
      --line: rgba(20, 17, 15, 0.12);
      --accent: #b4452e;
      --bg-1: #f6f1ea;
      --bg-2: #ece4d8;
      --bg-3: #e4dcf0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, var(--bg-3) 0%, transparent 55%),
        radial-gradient(120% 90% at 92% 100%, var(--bg-2) 0%, transparent 60%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 4rem);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.7s ease 0.05s forwards;
    }

    .topbar .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.55rem;
      vertical-align: middle;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 8vh, 6rem) 0;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
      opacity: 0;
      animation: rise 0.8s ease 0.15s forwards;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 6.5rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      max-width: 14ch;
      opacity: 0;
      animation: rise 0.9s ease 0.28s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      margin-top: clamp(1.6rem, 4vw, 2.6rem);
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 46ch;
      opacity: 0;
      animation: rise 0.9s ease 0.42s forwards;
    }

    .rule {
      margin-top: clamp(2.2rem, 6vw, 3.4rem);
      width: 100%;
      height: 1px;
      background: var(--line);
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 1s ease 0.6s forwards;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 2rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 1.6rem;
      opacity: 0;
      animation: rise 0.9s ease 0.7s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
      .rule { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <span><span class="dot"></span>Factory</span>
      <span>Internal</span>
    </div>

    <main>
      <p class="eyebrow">Onboarding · Smoke Test</p>
      <h1>Welcome to <em>factory</em> internal projects</h1>
      <p class="lede">
        You're in the right place. This is the starting point for building,
        testing, and shipping internal work — minimal by design, ready when you are.
      </p>
      <div class="rule"></div>
    </main>

    <footer>
      <span>Status — Online</span>
      <span>One-Page Welcome</span>
    </footer>
  </div>
</body>
</html>
