<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Ammar's workspace</title>
  <style>
    :root {
      --ink: #14131a;
      --ink-soft: #55525f;
      --accent: #5b4bff;
      --paper: #f7f5f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(900px 600px at 15% 10%, rgba(91, 75, 255, 0.10), transparent 60%),
        radial-gradient(1000px 700px at 90% 100%, rgba(255, 138, 76, 0.10), transparent 55%),
        linear-gradient(160deg, #faf8f4 0%, var(--paper) 45%, #efece5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 6rem);
      overflow-x: hidden;
    }

    .stage {
      max-width: 60rem;
      width: 100%;
    }

    .eyebrow {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: clamp(0.7rem, 1.4vw, 0.82rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 600;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 2.4rem;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
    }

    h1 {
      font-size: clamp(2.75rem, 10vw, 7rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
    }

    h1 .line {
      display: block;
      overflow: hidden;
    }

    h1 .line span {
      display: block;
      transform: translateY(110%);
      animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1 .line:nth-child(1) span { animation-delay: 0.2s; }
    h1 .line:nth-child(2) span { animation-delay: 0.35s; }

    .name {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.6s forwards;
    }

    footer {
      margin-top: clamp(2.5rem, 7vw, 4.5rem);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.8s forwards;
    }

    footer .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2fbf71;
      margin-right: 0.55rem;
      vertical-align: middle;
    }

    @keyframes reveal {
      to { transform: translateY(0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding · Workspace ready</p>
    <h1>
      <span class="line"><span>Welcome to</span></span>
      <span class="line"><span class="name">Ammar's workspace</span></span>
    </h1>
    <p class="lede">
      Everything's set up and running. This is your starting point — a quiet
      place to build, iterate, and ship. Dive in whenever you're ready.
    </p>
    <footer><span class="dot"></span>System online · Smoke test passed</footer>
  </main>
</body>
</html>
