<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Wen's workspace</title>
  <style>
    :root {
      --ink: #14131a;
      --muted: #6b6878;
      --accent: #5b4bff;
      --bg-1: #f6f4ff;
      --bg-2: #fdf2f8;
      --bg-3: #eef6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 120% at 0% 0%, var(--bg-2) 0%, transparent 55%),
        radial-gradient(120% 120% at 100% 0%, var(--bg-3) 0%, transparent 50%),
        radial-gradient(140% 140% at 50% 120%, var(--bg-1) 0%, transparent 60%),
        #ffffff;
      overflow-x: hidden;
    }

    main {
      max-width: 56rem;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards;
    }

    h1 {
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-size: clamp(2.75rem, 11vw, 7rem);
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
    }

    h1 .line {
      display: block;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    h1 .line:nth-child(1) { animation-delay: 0.15s; }
    h1 .line:nth-child(2) { animation-delay: 0.28s; }

    h1 .accent {
      background: linear-gradient(100deg, var(--accent), #c026d3 60%, #fb7185);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 38rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.42s forwards;
    }

    .rule {
      width: 4rem;
      height: 2px;
      background: var(--ink);
      margin: clamp(2rem, 5vw, 3rem) 0 0;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.25rem); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1 .line, p.lede { opacity: 1; animation: none; }
      .rule { transform: scaleX(1); animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding · Ready</p>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line accent">Wen's workspace</span>
    </h1>
    <p class="lede">
      Everything's wired up and ready to go. This is your space to build,
      experiment, and ship — start whenever you're ready.
    </p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
