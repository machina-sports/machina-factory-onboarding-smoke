<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to FQA 2004</title>
  <style>
    :root {
      --ink: #121212;
      --ink-soft: #55504a;
      --accent: #b4532a;
      --paper: #f4efe7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 15% 10%, #fbf8f2 0%, rgba(251,248,242,0) 55%),
        radial-gradient(130% 110% at 92% 95%, #e9dfcf 0%, rgba(233,223,207,0) 60%),
        linear-gradient(165deg, #f6f1e9 0%, #ece3d4 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 44rem;
      width: 100%;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: clamp(0.65rem, 2.2vw, 0.8rem);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s 0.1s ease forwards;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.75rem, 11vw, 6.5rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3.5vw, 2rem);
      opacity: 0;
      animation: rise 0.9s 0.25s ease forwards;
    }

    h1 .accent { color: var(--accent); }

    p.lede {
      font-size: clamp(1.05rem, 2.6vw, 1.35rem);
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.9s 0.4s ease forwards;
    }

    .rule {
      width: 3.5rem;
      height: 2px;
      background: var(--ink);
      margin: clamp(2rem, 5vw, 3rem) 0 clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: grow 0.8s 0.55s ease forwards;
    }

    footer {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0;
      animation: rise 0.9s 0.7s ease forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.25rem); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { opacity: 0; width: 0; }
      to   { opacity: 1; width: 3.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding &middot; 2004</p>
    <h1>Welcome to<br /><span class="accent">FQA 2004</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">You're all set. This is a minimal welcome screen &mdash; a quiet starting point before the real work begins.</p>
    <footer>FQA 2004</footer>
  </main>
</body>
</html>
