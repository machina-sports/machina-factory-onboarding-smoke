<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to ENTAIN Organization</title>
  <style>
    :root {
      --ink: #0e1116;
      --ink-soft: #4a5160;
      --accent: #1b6cf2;
      --line: rgba(14, 17, 22, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, #eef3ff 0%, rgba(238, 243, 255, 0) 55%),
        radial-gradient(120% 90% at 92% 100%, #fdf0ea 0%, rgba(253, 240, 234, 0) 50%),
        linear-gradient(170deg, #ffffff 0%, #f6f7fb 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7vw 6vw;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 720px;
      width: 100%;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.6rem;
      animation: rise 0.9s 0.05s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 {
      font-size: clamp(2.6rem, 8vw, 5.2rem);
      line-height: 1.02;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1.8rem;
      animation: rise 0.9s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 .org {
      display: block;
      font-weight: 700;
      font-style: italic;
    }

    .lede {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1rem, 2.4vw, 1.18rem);
      line-height: 1.65;
      color: var(--ink-soft);
      max-width: 48ch;
      animation: rise 0.9s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .rule {
      width: 56px;
      height: 2px;
      background: var(--ink);
      margin: 2.6rem 0 1.4rem;
      animation: grow 0.9s 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    footer {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      border-top: 1px solid var(--line);
      padding-top: 1.2rem;
      margin-top: 2.6rem;
      animation: rise 0.9s 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); transform-origin: left; }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to<span class="org">ENTAIN Organization</span></h1>
    <div class="rule" role="presentation"></div>
    <p class="lede">
      Your workspace is live. From here you'll orchestrate agents, run
      workflows, and connect the data that powers your sports intelligence.
    </p>
    <footer>Powered by Machina</footer>
  </main>
</body>
</html>
