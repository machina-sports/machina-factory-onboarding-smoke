<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Sentinel QA Ficticio</title>
  <style>
    :root {
      --ink: #14161c;
      --ink-soft: #5b606e;
      --accent: #3b4cca;
      --paper: #f7f6f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
      background-image:
        radial-gradient(1100px 700px at 82% -12%, rgba(59, 76, 202, 0.14), transparent 60%),
        radial-gradient(900px 640px at 8% 118%, rgba(200, 120, 60, 0.12), transparent 58%),
        linear-gradient(160deg, #faf9f5 0%, #f1eee7 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 46rem;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
      opacity: 0;
      animation: rise 0.7s ease 0.05s forwards;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5.75rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: rise 0.8s ease 0.15s forwards;
    }

    h1 .accent { color: var(--accent); }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      line-height: 1.55;
      color: var(--ink-soft);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.8s ease 0.28s forwards;
    }

    .rule {
      width: 3.5rem;
      height: 2px;
      background: var(--accent);
      margin: clamp(2rem, 5vw, 3rem) 0 clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: grow 0.7s ease 0.42s forwards;
    }

    footer {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      opacity: 0;
      animation: rise 0.8s ease 0.55s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); transform-origin: left; }
      to { opacity: 1; transform: scaleX(1); transform-origin: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding · Smoke Test</p>
    <h1>Welcome to<br /><span class="accent">Sentinel QA Ficticio</span></h1>
    <p class="lede">
      Everything is wired up and running. This page is a minimal onboarding
      checkpoint — clean, quiet, and ready for what comes next.
    </p>
    <div class="rule" role="presentation"></div>
    <footer>Status: Ready</footer>
  </main>
</body>
</html>
