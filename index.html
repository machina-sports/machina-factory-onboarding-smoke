<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to FQA 2009</title>
  <style>
    :root {
      --ink: #14130f;
      --muted: #6b6758;
      --accent: #b4532a;
      --line: rgba(20, 19, 15, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 15% 10%, #fdf6ec 0%, rgba(253, 246, 236, 0) 55%),
        radial-gradient(130% 110% at 85% 90%, #f1e6d6 0%, rgba(241, 230, 214, 0) 60%),
        linear-gradient(160deg, #faf4ea 0%, #f3ead9 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 44rem;
      width: 100%;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: clamp(0.65rem, 1.6vw, 0.78rem);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s ease 0.1s forwards;
    }

    h1 {
      font-size: clamp(2.8rem, 10vw, 6.5rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: rise 0.9s ease 0.25s forwards;
    }

    h1 .year {
      display: block;
      color: var(--accent);
      font-style: italic;
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      padding-top: clamp(1.25rem, 3vw, 1.75rem);
      border-top: 1px solid var(--line);
      opacity: 0;
      animation: rise 1s ease 0.45s forwards;
    }

    .meta {
      margin-top: clamp(2rem, 5vw, 3rem);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 1s ease 0.65s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, p.lede, .meta { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to<span class="year">FQA 2009</span></h1>
    <p class="lede">You're all set. This is a minimal starting point — clean, quiet, and ready for whatever comes next.</p>
    <p class="meta">Smoke test · All systems go</p>
  </main>
</body>
</html>
