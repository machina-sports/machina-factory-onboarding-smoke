<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Felipe's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6157;
      --line: #e7e0d6;
      --accent: #b4502b;
      --bg-1: #fbf7f0;
      --bg-2: #f3ece0;
      --bg-3: #efe6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      font-family: Georgia, "Times New Roman", Times, serif;
      color: var(--ink);
      background:
        radial-gradient(120% 120% at 0% 0%, var(--bg-3) 0%, transparent 45%),
        radial-gradient(120% 120% at 100% 100%, var(--bg-2) 0%, transparent 50%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 720px;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: clamp(1.25rem, 4vw, 2rem);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.05s forwards;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 4vw, 1.75rem);
    }

    h1 .line {
      display: block;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    h1 .line:nth-child(1) { animation-delay: 0.15s; }
    h1 .line:nth-child(2) { animation-delay: 0.28s; }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: 64px;
      height: 2px;
      background: var(--ink);
      margin: 0 0 clamp(1.25rem, 4vw, 1.75rem);
      transform-origin: left center;
      transform: scaleX(0);
      animation: grow 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.5s forwards;
    }

    p {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.6s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1 .line, p { opacity: 1; animation: none; }
      .rule { transform: scaleX(1); animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding &middot; Smoke Test</p>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line"><span class="accent">Felipe&rsquo;s</span> workspace</span>
    </h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Everything is wired up and ready to go. This is your starting point &mdash; clean, quiet, and waiting for what&rsquo;s next.</p>
  </main>
</body>
</html>
