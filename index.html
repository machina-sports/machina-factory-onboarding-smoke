<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Machina Drops</title>
  <meta name="description" content="Welcome to Machina Drops.">
  <style>
    :root {
      --paper: oklch(97.5% 0.008 80);
      --paper-deep: oklch(92% 0.02 70);
      --ink: oklch(20% 0.01 60);
      --ink-soft: oklch(42% 0.01 60);
      --accent: oklch(58% 0.16 35);
      --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --text: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--text);
      background:
        radial-gradient(120% 80% at 100% 0%, oklch(90% 0.04 45 / 0.55), transparent 60%),
        linear-gradient(170deg, var(--paper) 0%, var(--paper) 45%, var(--paper-deep) 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.5rem, 5vw, 4rem);
      gap: 2rem;
    }

    a { color: var(--accent); }
    a:hover { color: var(--ink); }

    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    main {
      align-self: center;
      max-width: 62rem;
      display: grid;
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .kicker::before {
      content: "";
      width: 2.5rem;
      height: 1px;
      background: currentColor;
    }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(3rem, 11vw, 8.5rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    p.lede {
      max-width: 34rem;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      line-height: 1.6;
      color: var(--ink-soft);
      text-wrap: pretty;
    }

    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        animation: rise 900ms cubic-bezier(.2,.7,.2,1) both;
      }
      .reveal:nth-child(2) { animation-delay: 120ms; }
      .reveal:nth-child(3) { animation-delay: 260ms; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
      }
    }
  </style>
</head>
<body>
  <header>
    <span>Machina Drops</span>
    <span>Issue No. 01</span>
  </header>

  <main>
    <span class="kicker reveal">Welcome</span>
    <h1 class="reveal">Welcome to <em>Machina</em> Drops</h1>
    <p class="lede reveal">Fresh sports stories, delivered as they land. You're in — settle in and enjoy the read.</p>
  </main>

  <footer>
    <span>machina.gg</span>
    <span>Est. 2025</span>
  </footer>
</body>
</html>
