<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to GENIE</title>
  <style>
    :root {
      --ink: #12100e;
      --muted: #6b645c;
      --accent: #c6512b;
      --paper: #f6f2ea;
      --paper-2: #efe7d8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #fbf7ef 0%, rgba(251,247,239,0) 60%),
        radial-gradient(900px 700px at 110% 20%, #f0d9c4 0%, rgba(240,217,196,0) 55%),
        linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 6rem);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      max-width: 760px;
      width: 100%;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.42em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 34px;
      height: 2px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 1rem;
      transform: translateY(-2px);
    }

    h1 {
      font-size: clamp(3.2rem, 13vw, 8.5rem);
      line-height: 0.92;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.4rem, 3.5vw, 2rem);
    }

    h1 .line {
      display: block;
      overflow: hidden;
    }

    h1 .line span {
      display: block;
      opacity: 0;
      transform: translateY(110%);
      animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1 .line:nth-child(1) span { animation-delay: 0.25s; }
    h1 .line:nth-child(2) span { animation-delay: 0.4s; }

    h1 .genie {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 46ch;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.7s forwards;
    }

    .footer {
      margin-top: clamp(2.5rem, 7vw, 4.5rem);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.9s forwards;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(198, 81, 43, 0.5);
      animation: pulse 2.2s ease-out infinite;
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(198, 81, 43, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(198, 81, 43, 0); }
      100% { box-shadow: 0 0 0 0 rgba(198, 81, 43, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding</p>
    <h1>
      <span class="line"><span>Welcome to</span></span>
      <span class="line"><span class="genie">GENIE</span></span>
    </h1>
    <p class="lede">Your workspace is ready. Everything from here starts with a single wish — let's get to work.</p>
    <div class="footer">
      <span class="dot" aria-hidden="true"></span>
      <span>System online</span>
    </div>
  </main>
</body>
</html>
