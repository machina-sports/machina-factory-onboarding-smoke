<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to 2474475505's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b635b;
      --accent: #b4532a;
      --paper: #f6f2ec;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 15% -10%, #fbeede 0%, rgba(251,238,222,0) 55%),
        radial-gradient(1000px 800px at 100% 110%, #e8ddf0 0%, rgba(232,221,240,0) 50%),
        linear-gradient(160deg, var(--paper) 0%, #efe9e1 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    .stage {
      max-width: 820px;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: rise 0.8s ease 0.1s forwards;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.6rem, 9vw, 5.6rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.9s ease 0.25s forwards;
    }

    h1 .accent {
      color: var(--accent);
      font-style: italic;
    }

    .lede {
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 56ch;
      margin-bottom: 2.75rem;
      opacity: 0;
      animation: rise 0.9s ease 0.45s forwards;
    }

    .rule {
      width: 64px;
      height: 2px;
      background: var(--ink);
      margin-bottom: 2.75rem;
      transform-origin: left;
      transform: scaleX(0);
      animation: draw 0.7s ease 0.6s forwards;
    }

    .meta {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 0.9s ease 0.75s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw {
      to { transform: scaleX(1); }
    }

    @media (max-width: 480px) {
      .eyebrow { letter-spacing: 0.24em; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding · Workspace ready</p>
    <h1>Welcome to <span class="accent">2474475505's</span> workspace</h1>
    <p class="lede">Everything's set up and ready to go. This is your home base — a clean, quiet place to build, ship, and iterate.</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="meta">Machina · Smoke test passed</p>
  </main>
</body>
</html>
