<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome — ENTAIN Organization</title>
<style>
  :root {
    --ink: #0e1116;
    --ink-soft: #4a5260;
    --rule: rgba(14, 17, 22, 0.12);
    --accent: #c8423a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: Georgia, "Times New Roman", "Iowan Old Style", serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(200, 66, 58, 0.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(64, 96, 160, 0.10), transparent 60%),
      linear-gradient(180deg, #f7f4ee 0%, #efece4 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: clamp(28px, 5vw, 64px);
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
  }

  header.masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .masthead .mark { font-weight: 700; color: var(--ink); }

  .masthead .meta { font-variant-numeric: tabular-nums; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    align-content: center;
    padding: clamp(48px, 12vh, 140px) 0;
    gap: clamp(28px, 5vw, 56px);
  }

  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .eyebrow::before {
    content: "";
    width: 36px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-size: clamp(48px, 9vw, 132px);
    line-height: 0.95;
    letter-spacing: -0.025em;
    font-weight: 400;
    max-width: 14ch;
  }

  h1 .em {
    font-style: italic;
    color: var(--ink-soft);
    font-weight: 400;
  }

  .lede {
    font-size: clamp(17px, 1.6vw, 21px);
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 56ch;
  }

  footer.colophon {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .colophon .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2ea44f;
    margin-right: 8px;
    vertical-align: middle;
  }

  /* Entrance choreography */
  .reveal { opacity: 0; transform: translateY(12px); animation: rise 900ms cubic-bezier(.2,.7,.2,1) forwards; }
  .r1 { animation-delay: 80ms; }
  .r2 { animation-delay: 220ms; }
  .r3 { animation-delay: 420ms; }
  .r4 { animation-delay: 600ms; }
  .r5 { animation-delay: 780ms; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 540px) {
    .masthead .meta, .colophon .right { display: none; }
  }
</style>
</head>
<body>
  <div class="frame">
    <header class="masthead reveal r1">
      <span class="mark">Machina × ENTAIN</span>
      <span class="meta">Onboarding · Vol. 01</span>
    </header>

    <main>
      <div class="eyebrow reveal r2">A new beginning</div>

      <h1 class="reveal r3">
        Welcome to <span class="em">ENTAIN Organization.</span>
      </h1>

      <p class="lede reveal r4">
        Your workspace is live. From here, agents, workflows, and signals
        come together — built for the pace of sport, tuned for the people
        who move it forward.
      </p>
    </main>

    <footer class="colophon reveal r5">
      <span><span class="dot"></span>System ready</span>
      <span class="right">Set in Georgia · Crafted by Machina</span>
    </footer>
  </div>
</body>
</html>
