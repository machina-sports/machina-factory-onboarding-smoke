<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Robin's workspace</title>
  <style>
    :root {
      --ink: #161412;
      --muted: #6b6258;
      --line: rgba(22, 20, 18, 0.12);
      --accent: #b8552e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 120% at 12% 8%, #fbf6ee 0%, #f4ece0 38%, #efe6d8 70%, #ece2d2 100%),
        #efe6d8;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .stage {
      width: min(54rem, 100%);
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(1.75rem, 4vw, 2.75rem);
      animation: fade 900ms ease 120ms both;
    }

    .eyebrow::before {
      content: "";
      width: 2.25rem;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 6rem);
      line-height: 1.02;
      letter-spacing: -0.022em;
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      animation: fade 900ms ease 200ms both;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      max-width: 34rem;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      animation: fade 900ms ease 320ms both;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: clamp(3rem, 7vw, 5rem);
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      animation: fade 900ms ease 440ms both;
    }

    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(184, 85, 46, 0.16);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .eyebrow, h1, .lede, .footer { animation: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <span class="eyebrow">Onboarding</span>
    <h1>Welcome to <span class="accent">Robin's</span> workspace</h1>
    <p class="lede">
      Everything is set up and ready to go. This is your starting point —
      a calm, clean place to build from.
    </p>
    <div class="footer">
      <span class="dot" aria-hidden="true"></span>
      <span>Workspace ready</span>
    </div>
  </main>
</body>
</html>
