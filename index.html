<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to FQA 2019</title>
  <style>
    :root {
      --ink: #14121a;
      --muted: #6b6676;
      --accent: #5b3df5;
      --bg-1: #f6f4ff;
      --bg-2: #fdf2f8;
      --bg-3: #eef6ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% -10%, var(--bg-2), transparent 60%),
        radial-gradient(1000px 800px at 100% 0%, var(--bg-3), transparent 55%),
        linear-gradient(180deg, var(--bg-1), #ffffff 85%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7vw 6vw;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      max-width: 760px;
      width: 100%;
    }

    .eyebrow {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: clamp(0.72rem, 1.4vw, 0.84rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    h1 {
      font-size: clamp(2.8rem, 9vw, 6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.9s ease 0.12s forwards;
    }

    h1 .accent {
      display: block;
      background: linear-gradient(100deg, var(--accent), #c026d3 70%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 54ch;
      margin-bottom: 2.75rem;
      opacity: 0;
      animation: rise 0.9s ease 0.24s forwards;
    }

    .rule {
      width: 64px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 99px;
      margin-bottom: 2.75rem;
      opacity: 0;
      animation: rise 0.9s ease 0.18s forwards;
    }

    .meta {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease 0.36s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding · Smoke Test</p>
    <h1>Welcome to<span class="accent">FQA 2019</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">Everything's wired up and running. This is your clean slate — a quiet starting point before the real work begins.</p>
    <p class="meta">STATUS: READY</p>
  </main>
</body>
</html>
