<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to 2026 World Cup</title>
  <style>
    :root {
      --ink: #0d1b2a;
      --muted: #5a6b7b;
      --accent: #0a7d4d;
      --line: rgba(13, 27, 42, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, rgba(10, 125, 77, 0.10), transparent 55%),
        radial-gradient(120% 90% at 92% 96%, rgba(199, 158, 60, 0.14), transparent 55%),
        linear-gradient(160deg, #fcfbf7 0%, #f4f1ea 100%);
      overflow-x: hidden;
    }

    main {
      max-width: 64rem;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.72rem, 1.4vw, 0.85rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
      opacity: 0;
      animation: rise 0.8s ease 0.1s forwards;
    }

    h1 {
      font-size: clamp(2.75rem, 11vw, 8rem);
      line-height: 0.94;
      font-weight: 700;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: rise 0.9s ease 0.25s forwards;
    }

    h1 .line { display: block; }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-size: clamp(1.05rem, 2.2vw, 1.4rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 38rem;
      margin-top: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.9s ease 0.45s forwards;
    }

    .rule {
      width: 4rem;
      height: 2px;
      background: var(--ink);
      margin: clamp(2rem, 5vw, 3rem) 0 clamp(1rem, 3vw, 1.5rem);
      opacity: 0;
      animation: rise 0.9s ease 0.6s forwards;
    }

    .meta {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.78rem, 1.4vw, 0.92rem);
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      opacity: 0;
      animation: rise 0.9s ease 0.75s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kickoff &middot; Summer 2026</p>
    <h1>
      <span class="line">Welcome to the</span>
      <span class="line"><span class="accent">2026</span> World Cup</span>
    </h1>
    <p class="lede">
      The world's biggest stage returns. Three nations, sixteen cities,
      and a single trophy. The countdown starts here.
    </p>
    <div class="rule"></div>
    <p class="meta">United States &middot; Canada &middot; Mexico</p>
  </main>
</body>
</html>
