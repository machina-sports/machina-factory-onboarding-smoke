<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Machina Drops</title>
  <style>
    :root {
      --ink: #0e0e10;
      --muted: #6b6b73;
      --line: #e4e2dd;
      --accent: #d6472f;
      --paper: #f6f4ef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 8% 4%, #fbfaf7 0%, rgba(251,250,247,0) 55%),
        radial-gradient(130% 100% at 100% 100%, #eceae3 0%, rgba(236,234,227,0) 60%),
        linear-gradient(160deg, #f7f5f0 0%, #efece5 100%);
      background-color: var(--paper);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrap {
      flex: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(1.75rem, 5vw, 3.5rem);
      display: flex;
      flex-direction: column;
    }

    /* Masthead */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      animation: rise 0.7s ease forwards;
    }

    .brand {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--ink);
    }

    .edition {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Hero */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(3rem, 12vh, 8rem) 0;
    }

    .kicker {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.7s ease 0.1s forwards;
    }

    h1 {
      font-size: clamp(2.9rem, 11vw, 7.5rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      max-width: 14ch;
      opacity: 0;
      animation: rise 0.9s ease 0.2s forwards;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      margin-top: clamp(1.75rem, 4vw, 2.5rem);
      font-size: clamp(1.05rem, 2.2vw, 1.45rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 46ch;
      opacity: 0;
      animation: rise 0.9s ease 0.35s forwards;
    }

    .actions {
      margin-top: clamp(2rem, 5vw, 3rem);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem 2rem;
      opacity: 0;
      animation: rise 0.9s ease 0.5s forwards;
    }

    .cta {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--paper);
      background: var(--ink);
      text-decoration: none;
      padding: 1rem 1.9rem;
      border-radius: 999px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .cta:hover { transform: translateY(-2px); background: var(--accent); }

    .cta:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .note {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    /* Footer */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.7s ease 0.65s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }

    @media (max-width: 480px) {
      footer { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="brand">Machina&nbsp;·&nbsp;Drops</span>
      <span class="edition">Onboarding Edition</span>
    </header>

    <main>
      <p class="kicker">You're on the list</p>
      <h1>Welcome to <em>Machina Drops</em></h1>
      <p class="lede">
        Curated releases, delivered with intent. This is your quiet corner of
        the platform — clean, considered, and ready when you are.
      </p>
      <div class="actions">
        <a class="cta" href="#">Get started</a>
        <span class="note">No setup required · smoke test build</span>
      </div>
    </main>

    <footer>
      <span>Machina Drops</span>
      <span>Est. 2026</span>
    </footer>
  </div>
</body>
</html>
