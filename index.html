<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to FQA 2010</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b645c;
      --line: rgba(20, 17, 15, 0.1);
      --accent: #b4492b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 15% -10%, #fbf3e6 0%, transparent 55%),
        radial-gradient(1000px 800px at 110% 20%, #efe6f2 0%, transparent 50%),
        linear-gradient(160deg, #fdfbf7 0%, #f4eee6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8vw 6vw;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 760px;
      width: 100%;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 80ms both;
    }

    .eyebrow::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 6.5rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 160ms both;
    }

    h1 .accent { color: var(--accent); }

    p.lede {
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both;
    }

    .footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 320ms both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Onboarding</div>
    <h1>Welcome to <span class="accent">FQA 2010</span></h1>
    <p class="lede">You're all set. This is a minimal welcome screen — clean, fast, and ready to build on.</p>
    <div class="footer">FQA 2010 &middot; Established</div>
  </main>
</body>
</html>
