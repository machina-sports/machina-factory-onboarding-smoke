<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Vince's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --ink-soft: #5a534d;
      --line: rgba(20, 17, 15, 0.08);
      --accent: #b8552e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, #fbf4ea 0%, rgba(251, 244, 234, 0) 55%),
        radial-gradient(130% 100% at 88% 92%, #efe7f3 0%, rgba(239, 231, 243, 0) 50%),
        linear-gradient(165deg, #fdfbf7 0%, #f4eee6 100%);
      padding: clamp(1.5rem, 6vw, 6rem);
      overflow-x: hidden;
    }

    main {
      max-width: 56rem;
      margin: 0 auto;
      width: 100%;
    }

    .eyebrow {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: clamp(0.65rem, 1.4vw, 0.78rem);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s ease forwards;
      animation-delay: 0.1s;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 6.5rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.25s;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      line-height: 1.55;
      color: var(--ink-soft);
      max-width: 38rem;
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.45s;
    }

    .rule {
      height: 1px;
      width: 100%;
      background: var(--line);
      margin: clamp(2.5rem, 6vw, 4rem) 0 clamp(1.5rem, 3vw, 2rem);
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 1s ease forwards;
      animation-delay: 0.6s;
    }

    .meta {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.75s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="accent">Vince's</span> workspace</h1>
    <p class="lede">A quiet place to think, build, and ship. Everything you need is one keystroke away — start whenever you're ready.</p>
    <div class="rule"></div>
    <p class="meta">Machina &middot; Smoke test passed</p>
  </main>
</body>
</html>
