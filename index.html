<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Factory 1</title>
  <style>
    :root {
      --paper: oklch(97.5% 0.008 80);
      --paper-warm: oklch(93% 0.025 70);
      --ink: oklch(20% 0.012 60);
      --muted: oklch(48% 0.015 60);
      --accent: oklch(58% 0.14 40);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(2rem, 8vw, 8rem) clamp(1.5rem, 6vw, 6rem);
      background:
        radial-gradient(120% 90% at 85% 10%, var(--paper-warm) 0%, transparent 60%),
        linear-gradient(170deg, var(--paper) 0%, oklch(95% 0.015 75) 100%);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      overflow-x: hidden;
    }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }
    main {
      width: 100%;
      max-width: 62rem;
      display: flex;
      flex-direction: column;
      gap: clamp(1.25rem, 3vw, 2rem);
    }
    .eyebrow {
      margin: 0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .eyebrow::before {
      content: "";
      width: 2.5rem;
      height: 1px;
      background: var(--accent);
    }
    h1 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(3rem, 11vw, 8.5rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .lede {
      margin: 0;
      max-width: 32rem;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.55;
      color: var(--muted);
      text-wrap: pretty;
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
      main > :nth-child(2) { animation-delay: 0.12s; }
      main > :nth-child(3) { animation-delay: 0.24s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Machina Factory</p>
    <h1>Welcome to <em>Factory&nbsp;1</em></h1>
    <p class="lede">Your workspace is ready. Everything starts here.</p>
  </main>
</body>
</html>
