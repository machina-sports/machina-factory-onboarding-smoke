<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Machina Drops</title>
  <meta name="description" content="Welcome to Machina Drops.">
  <style>
    :root {
      --paper: oklch(97% 0.012 80);
      --paper-2: oklch(92% 0.03 60);
      --ink: oklch(18% 0.01 60);
      --muted: oklch(42% 0.015 60);
      --accent: oklch(55% 0.17 35);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 2rem;
      padding: clamp(1.5rem, 5vw, 4rem);
      color: var(--ink);
      font-family: var(--serif);
      background:
        radial-gradient(120% 80% at 100% 0%, var(--paper-2) 0%, transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, oklch(95% 0.02 70) 100%);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      align-self: center;
      max-width: 62rem;
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0 0 1.5rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .kicker::before {
      content: "";
      width: 2.5rem;
      height: 2px;
      background: currentColor;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 11vw, 8.5rem);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .lede {
      max-width: 34rem;
      margin: 2.25rem 0 0;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      line-height: 1.55;
      color: var(--muted);
      text-wrap: pretty;
    }

    footer {
      border-top: 1px solid oklch(18% 0.01 60 / 0.15);
      padding-top: 1rem;
    }

    @media (prefers-reduced-motion: no-preference) {
      .kicker, h1, .lede { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
      h1 { animation-delay: 0.08s; }
      .lede { animation-delay: 0.2s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
      }
    }
  </style>
</head>
<body>
  <header class="meta">
    <span>Machina Drops</span>
    <span>Issue 01</span>
  </header>

  <main>
    <p class="kicker">Welcome</p>
    <h1>Welcome to <em>Machina</em> Drops</h1>
    <p class="lede">You're in. This is where new drops land first — start here.</p>
  </main>

  <footer class="meta">
    <span>Machina</span>
    <span>machina.gg</span>
  </footer>
</body>
</html>
