<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Machina Video Ads</title>
  <style>
    :root {
      --ink: #0e0e12;
      --muted: #5a5a68;
      --accent: #3a2bff;
      --bg-1: #f6f5f2;
      --bg-2: #eceaff;
      --bg-3: #f9eef0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 85% 0%, var(--bg-2) 0%, transparent 55%),
        radial-gradient(110% 80% at 0% 100%, var(--bg-3) 0%, transparent 50%),
        var(--bg-1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 44rem;
      width: 100%;
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: fade 0.8s ease 0.15s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 2.2rem;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
    }

    h1 {
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
    }

    h1 .line { display: block; }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      opacity: 0;
      animation: fade 0.8s ease 0.45s forwards;
    }

    footer {
      margin-top: clamp(2.5rem, 6vw, 4rem);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      opacity: 0;
      animation: fade 0.8s ease 0.65s forwards;
    }

    footer strong { color: var(--ink); font-weight: 600; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .eyebrow, p.lede, footer {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line"><em>Machina</em> Video Ads</span>
    </h1>
    <p class="lede">
      Your workspace is live. This is where generated ad content, campaigns,
      and creative experiments come together — ready for you to start building.
    </p>
    <footer>Powered by <strong>Machina</strong></footer>
  </main>
</body>
</html>
