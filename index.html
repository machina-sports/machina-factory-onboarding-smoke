<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to zhang</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6157;
      --accent: #b4541e;
      --line: rgba(20, 17, 15, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, #fdf7ef 0%, rgba(253, 247, 239, 0) 55%),
        radial-gradient(130% 100% at 92% 92%, #f3e6da 0%, rgba(243, 230, 218, 0) 50%),
        linear-gradient(160deg, #fbf6f0 0%, #f5ece2 100%);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .stage {
      max-width: 56rem;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.42em;
      font-size: clamp(0.65rem, 1.6vw, 0.78rem);
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      padding-left: 0.1em;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    h1 {
      font-size: clamp(2.8rem, 12vw, 8rem);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
    }

    h1 .line {
      display: block;
      overflow: hidden;
    }

    h1 .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(110%);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    h1 .word:nth-child(1) { animation-delay: 0.18s; }
    h1 .word:nth-child(2) { animation-delay: 0.30s; }

    .name {
      font-style: italic;
      color: var(--accent);
      animation-delay: 0.46s;
    }

    .rule {
      height: 1px;
      background: var(--line);
      width: 100%;
      margin: clamp(1.75rem, 5vw, 3rem) 0;
      transform: scaleX(0);
      transform-origin: left;
      animation: grow 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    .sub {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding</p>
    <h1>
      <span class="line"><span class="word">Welcome</span> <span class="word">to</span></span>
      <span class="line"><span class="word name">zhang</span></span>
    </h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="sub">You're all set. This is the start of something built with care &mdash; clean, considered, and ready when you are.</p>
  </main>
</body>
</html>
