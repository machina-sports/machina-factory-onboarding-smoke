<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Jose's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b635b;
      --accent: #b5482b;
      --paper: #f7f3ec;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, #fbf8f2 0%, rgba(251,248,242,0) 55%),
        radial-gradient(100% 80% at 88% 100%, #efe6d6 0%, rgba(239,230,214,0) 50%),
        linear-gradient(160deg, #faf6ef 0%, #f0e9dd 100%);
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      max-width: 760px;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 2rem;
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.75rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
    }

    h1 .line {
      display: block;
      opacity: 0;
      animation: rise 0.9s ease forwards;
    }

    h1 .line:nth-child(1) { animation-delay: 0.12s; }
    h1 .line:nth-child(2) { animation-delay: 0.24s; }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: 64px;
      height: 3px;
      background: var(--ink);
      margin: 0 0 1.75rem;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.7s ease 0.4s forwards;
    }

    p.lede {
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      opacity: 0;
      animation: rise 0.9s ease 0.5s forwards;
    }

    .footer {
      margin-top: 3.5rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease 0.65s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding · Smoke Test</p>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line"><span class="accent">Jose's</span> workspace</span>
    </h1>
    <div class="rule"></div>
    <p class="lede">Everything's wired up and ready. This is your starting point — clean, quiet, and waiting for the work to begin.</p>
    <p class="footer">MACHINA · WORKSPACE READY</p>
  </main>
</body>
</html>
