<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Rodrigo Teste 2</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6259;
      --accent: #b4532a;
      --paper: #f7f3ec;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #fdf8f0 0%, rgba(253, 248, 240, 0) 60%),
        radial-gradient(900px 500px at 110% 120%, #efe4d4 0%, rgba(239, 228, 212, 0) 55%),
        linear-gradient(160deg, var(--paper) 0%, #efe6d8 100%);
      overflow-x: hidden;
    }

    main {
      max-width: 720px;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.9s ease 0.12s forwards;
    }

    h1 .accent { color: var(--accent); }

    .rule {
      width: 64px;
      height: 3px;
      background: var(--accent);
      margin: 0 0 1.5rem;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.7s ease 0.3s forwards;
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 52ch;
      opacity: 0;
      animation: rise 0.9s ease 0.4s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, p.lede { opacity: 1; animation: none; }
      .rule { transform: scaleX(1); animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to<br /><span class="accent">Rodrigo Teste 2</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">Your workspace is up and running. This is a quick smoke test confirming everything is wired correctly — clean, minimal, and ready to build on.</p>
  </main>
</body>
</html>
