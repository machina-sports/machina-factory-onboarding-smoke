<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to wc26-analytics</title>
  <style>
    :root {
      --ink: #11131a;
      --muted: #5b6170;
      --accent: #2f5bff;
      --bg-1: #f6f7fb;
      --bg-2: #eef1fb;
      --bg-3: #fbf3ee;
      --hair: rgba(17, 19, 26, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, var(--bg-3), transparent 60%),
        radial-gradient(1000px 700px at 95% 110%, var(--bg-2), transparent 55%),
        linear-gradient(180deg, var(--bg-1), #ffffff 70%);
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
    }

    .shell {
      flex: 1;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 6rem) clamp(1.5rem, 5vw, 3rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(1.75rem, 4vw, 2.75rem);
    }

    .eyebrow {
      font-family: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: clamp(2.8rem, 9vw, 5.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.08s both;
    }

    h1 .accent {
      display: block;
      background: linear-gradient(100deg, var(--accent), #7b3bff 70%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      max-width: 54ch;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.16s both;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.4rem;
      font-family: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      padding-top: 0.5rem;
      border-top: 1px solid var(--hair);
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.24s both;
    }

    .meta .dot { color: var(--accent); }

    footer {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem clamp(1.5rem, 5vw, 3rem);
      font-family: "SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      opacity: 0.8;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <span class="eyebrow">Onboarding · Smoke Test</span>
    <h1>
      Welcome to
      <span class="accent">wc26-analytics</span>
    </h1>
    <p class="lede">
      Everything is wired up and running. This is your starting point — a clean
      canvas ready for the analytics, fixtures, and insights to come.
    </p>
    <div class="meta">
      <span><span class="dot">●</span> Status: live</span>
      <span><span class="dot">●</span> Build: passing</span>
      <span><span class="dot">●</span> Stack: single-file</span>
    </div>
  </main>
  <footer>wc26-analytics — powered by Machina</footer>
</body>
</html>
