<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to FQA 2012</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b655f;
      --line: #e4ddd3;
      --accent: #b4532a;
      --paper: #f6f1e8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", Cambria, serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #fff 0%, rgba(255,255,255,0) 55%),
        radial-gradient(1000px 700px at 110% 120%, #efe6d6 0%, rgba(239,230,214,0) 60%),
        linear-gradient(160deg, #faf6ee 0%, var(--paper) 45%, #efe3d2 100%);
      background-color: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 44rem;
      width: 100%;
      text-align: left;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1.75rem;
      animation: rise 900ms 80ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 6rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      animation: rise 900ms 160ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 .year {
      display: block;
      color: var(--accent);
      font-style: italic;
    }

    .rule {
      width: 4rem;
      height: 2px;
      background: var(--ink);
      margin: 0 0 1.5rem;
      transform-origin: left;
      animation: grow 900ms 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    p {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.7;
      color: var(--muted);
      max-width: 34rem;
      animation: rise 900ms 400ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to<span class="year">FQA 2012</span></h1>
    <div class="rule"></div>
    <p>You're all set. This is your starting point — a quiet, deliberate place to begin the work ahead.</p>
  </main>
</body>
</html>
