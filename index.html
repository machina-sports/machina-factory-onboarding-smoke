<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Rodrigo Teste 2</title>
  <style>
    :root {
      --ink: #14121a;
      --muted: #6b6577;
      --accent: #5b3df5;
      --line: rgba(20, 18, 26, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #ece6ff 0%, transparent 55%),
        radial-gradient(1000px 700px at 100% 110%, #ffe9f2 0%, transparent 50%),
        linear-gradient(160deg, #fbfaff 0%, #f4f2fb 100%);
      overflow-x: hidden;
    }

    .card {
      width: min(720px, 100%);
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: rise 0.7s ease 0.05s forwards;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5.75rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      font-weight: 700;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.8s ease 0.18s forwards;
    }

    h1 .accent {
      display: block;
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 46ch;
      opacity: 0;
      animation: rise 0.8s ease 0.32s forwards;
    }

    .rule {
      width: 64px;
      height: 3px;
      background: var(--accent);
      margin: 2.5rem 0 1.75rem;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.7s ease 0.46s forwards;
    }

    footer {
      margin-top: 3rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s ease 0.6s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding &middot; Smoke Test</p>
    <h1>Welcome to<span class="accent">Rodrigo Teste 2</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="lede">
      Everything is wired up and running. This is your starting point &mdash; clean,
      fast, and ready for whatever comes next.
    </p>
    <footer>Powered by Machina</footer>
  </main>
</body>
</html>
