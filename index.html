<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to joshshargo's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6259;
      --line: #e6ddd3;
      --accent: #c2451d;
      --bg-1: #fbf7f1;
      --bg-2: #f3ece1;
      --bg-3: #efe7f0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% -10%, var(--bg-3) 0%, transparent 55%),
        radial-gradient(1000px 800px at 110% 120%, var(--bg-2) 0%, transparent 60%),
        linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .card {
      width: 100%;
      max-width: 720px;
    }

    .eyebrow {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: clamp(1.75rem, 4vw, 2.75rem);
      opacity: 0;
      animation: rise 0.8s ease forwards 0.1s;
    }

    .eyebrow::before {
      content: "";
      width: 2.25rem;
      height: 1px;
      background: var(--accent);
      flex: none;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.25rem);
      line-height: 1.02;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
    }

    h1 .name {
      font-style: italic;
      color: var(--accent);
    }

    h1 .line {
      display: block;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    h1 .line:nth-child(1) { animation-delay: 0.2s; }
    h1 .line:nth-child(2) { animation-delay: 0.35s; }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 46ch;
      margin-bottom: clamp(2.5rem, 6vw, 3.5rem);
      opacity: 0;
      animation: rise 0.9s ease forwards 0.55s;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-top: clamp(1.5rem, 4vw, 2rem);
      border-top: 1px solid var(--line);
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.75s;
    }

    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
      flex: none;
      box-shadow: 0 0 0 0 rgba(194, 69, 29, 0.45);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(194, 69, 29, 0.4); }
      50%      { box-shadow: 0 0 0 6px rgba(194, 69, 29, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .eyebrow, h1 .line, p.lede, .footer { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding · Workspace ready</p>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line"><span class="name">joshshargo's</span> workspace</span>
    </h1>
    <p class="lede">
      Everything's set up and ready to go. This is your space to build,
      experiment, and ship — clean slate, no clutter.
    </p>
    <div class="footer">
      <span class="dot" aria-hidden="true"></span>
      <span>All systems nominal</span>
    </div>
  </main>
</body>
</html>
