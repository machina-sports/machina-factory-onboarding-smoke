<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome to Cahya's workspace</title>
  <style>
    :root {
      --ink: #16151a;
      --muted: #6b6675;
      --line: #e6e2ec;
      --accent: #6d4aff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(109,74,255,0.10), transparent 60%),
        radial-gradient(900px 500px at 5% 110%, rgba(255,138,76,0.08), transparent 55%),
        linear-gradient(180deg, #fcfbff 0%, #f4f1fa 100%);
      display: flex;
      flex-direction: column;
      padding: clamp(1.5rem, 5vw, 4rem);
      overflow-x: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(109,74,255,0.14);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 60rem;
    }

    .eyebrow {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: rise 0.7s ease 0.05s forwards;
    }

    h1 {
      font-size: clamp(2.8rem, 9vw, 6.5rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: rise 0.8s ease 0.18s forwards;
    }

    h1 .accent {
      font-style: italic;
      background: linear-gradient(120deg, var(--accent), #ff8a4c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lede {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.8s ease 0.32s forwards;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      opacity: 0;
      animation: rise 0.8s ease 0.46s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .lede, footer { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="dot" aria-hidden="true"></span>
    <span>Cahya · Workspace</span>
  </header>

  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="accent">Cahya's</span> workspace</h1>
    <p class="lede">
      Everything's set up and ready to go. This is your home base — a calm,
      uncluttered place to build, ship, and iterate.
    </p>
  </main>

  <footer>
    <span>Smoke test · all systems nominal</span>
    <span>Built with a single HTML file</span>
  </footer>
</body>
</html>
