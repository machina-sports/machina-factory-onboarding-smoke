<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to FQA 2001</title>
  <style>
    :root {
      --ink: #14130f;
      --muted: #6f6a60;
      --line: rgba(20, 19, 15, 0.12);
      --accent: #b4532a;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 120% at 15% 0%, #fbf6ec 0%, rgba(251, 246, 236, 0) 55%),
        radial-gradient(130% 130% at 100% 100%, #efe6f3 0%, rgba(239, 230, 243, 0) 50%),
        linear-gradient(160deg, #fdfaf3 0%, #f4eee3 45%, #ece4ef 100%);
      overflow-x: hidden;
    }

    main {
      width: 100%;
      max-width: 44rem;
      text-align: left;
    }

    .eyebrow {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: clamp(0.7rem, 1.6vw, 0.82rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 2.5rem;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
      transform: translateY(-0.15em);
    }

    h1 {
      font-weight: 700;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.22s forwards;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.6vw, 1.4rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.36s forwards;
    }

    footer {
      margin-top: clamp(2.5rem, 7vw, 4.5rem);
      padding-top: clamp(1.25rem, 3vw, 1.75rem);
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.5s forwards;
    }

    footer .status {
      color: var(--ink);
    }

    footer .dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #3f9b4f;
      margin-right: 0.5rem;
      vertical-align: middle;
      transform: translateY(-0.05em);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow,
      h1,
      p.lede,
      footer {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding &middot; Smoke Test</p>
    <h1>Welcome to <span class="accent">FQA&nbsp;2001</span></h1>
    <p class="lede">
      Everything is wired up and ready. This is your starting point &mdash;
      clean, fast, and built to grow from here.
    </p>
    <footer>
      <span><span class="dot"></span><span class="status">System online</span></span>
      <span>FQA 2001</span>
      <span>v1.0</span>
    </footer>
  </main>
</body>
</html>
