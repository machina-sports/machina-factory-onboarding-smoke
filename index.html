<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to asda</title>
  <style>
    :root {
      --ink: #12100e;
      --muted: #6b6459;
      --accent: #b4531f;
      --paper: #f6f1e8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 15% 10%, #fbf7ef 0%, rgba(251,247,239,0) 55%),
        radial-gradient(130% 100% at 100% 100%, #efe4d2 0%, rgba(239,228,210,0) 60%),
        linear-gradient(150deg, #f8f3ea 0%, #efe6d6 100%);
      overflow-x: hidden;
    }

    .stage {
      max-width: 46rem;
      width: 100%;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      opacity: 0;
      animation: rise 0.8s ease-out 0.05s forwards;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.75rem, 11vw, 6.5rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.9s ease-out 0.2s forwards;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: 3.5rem;
      height: 2px;
      background: var(--ink);
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      transform-origin: left;
      transform: scaleX(0);
      animation: draw 0.8s ease-out 0.55s forwards;
    }

    p {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.9s ease-out 0.7s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.25rem); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .rule, p { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="accent">asda</span></h1>
    <div class="rule" role="presentation"></div>
    <p>You're all set. This is a minimal starting point &mdash; clean, quiet, and ready for whatever comes next.</p>
  </main>
</body>
</html>
