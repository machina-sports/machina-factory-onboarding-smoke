<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Vivek's workspace</title>
  <style>
    :root {
      --ink: #14121c;
      --muted: #6b6676;
      --accent: #6d5cff;
      --paper: #f6f4ef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(109, 92, 255, 0.14), transparent 60%),
        radial-gradient(1000px 700px at 95% 110%, rgba(255, 138, 101, 0.12), transparent 55%),
        linear-gradient(180deg, var(--paper), #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1.5rem, 5vw, 5rem);
      overflow-x: hidden;
    }

    main {
      max-width: 54rem;
      width: 100%;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 2.5rem;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: rise 0.9s ease 0.12s forwards;
    }

    h1 .name {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 40rem;
      opacity: 0;
      animation: rise 0.9s ease 0.24s forwards;
    }

    .meta {
      margin-top: clamp(2.5rem, 6vw, 4rem);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      animation: rise 0.9s ease 0.36s forwards;
    }

    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #3ec97a;
      box-shadow: 0 0 0 4px rgba(62, 201, 122, 0.18);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="name">Vivek's</span> workspace</h1>
    <p class="lede">
      A quiet place to think, build, and ship. Everything you need is one step away &mdash;
      take your time and make yourself at home.
    </p>
    <p class="meta"><span class="dot"></span> Workspace ready</p>
  </main>
</body>
</html>
