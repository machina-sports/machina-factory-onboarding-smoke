<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Welcome — mateuspinheiro.umbriel+235789</title>
<style>
  :root {
    --ink: #0b0b0f;
    --ink-soft: #43434d;
    --accent: #6b4cff;
    --paper: #f6f3ee;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: ui-serif, Georgia, "Iowan Old Style", "Apple Garamond", "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 85% -10%, rgba(107, 76, 255, 0.18), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, rgba(255, 168, 76, 0.22), transparent 55%),
      linear-gradient(180deg, #fbf8f3 0%, var(--paper) 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(24px, 5vw, 56px);
    gap: clamp(40px, 8vh, 96px);
  }

  header.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(107, 76, 255, 0.15);
  }

  section.hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }

  .eyebrow {
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 clamp(20px, 3vh, 32px);
  }

  h1 {
    font-family: "Recoleta", "Bodoni 72", "Didot", "Playfair Display", ui-serif, Georgia, serif;
    font-weight: 700;
    font-size: clamp(40px, 8.5vw, 112px);
    line-height: 0.98;
    letter-spacing: -0.025em;
    margin: 0;
    color: var(--ink);
  }

  h1 .welcome {
    display: block;
    font-style: italic;
    font-weight: 400;
    color: var(--ink-soft);
    font-size: clamp(28px, 5vw, 56px);
    letter-spacing: -0.01em;
    margin-bottom: clamp(8px, 1.5vh, 16px);
  }

  h1 .handle {
    background: linear-gradient(135deg, var(--ink) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    word-break: break-word;
  }

  .lede {
    margin-top: clamp(24px, 4vh, 40px);
    max-width: 56ch;
    font-size: clamp(16px, 1.6vw, 19px);
    line-height: 1.6;
    color: var(--ink-soft);
  }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  footer .rule {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(11, 11, 15, 0.18), transparent);
    margin: 0 20px;
  }

  @media (max-width: 480px) {
    footer { flex-direction: column; gap: 12px; }
    footer .rule { width: 100%; margin: 0; }
  }
</style>
</head>
<body>
  <main>
    <header class="brand">
      <span class="dot" aria-hidden="true"></span>
      <span>Workspace</span>
    </header>

    <section class="hero">
      <p class="eyebrow">Onboarding · Smoke Test</p>
      <h1>
        <span class="welcome">Welcome to</span>
        <span class="handle">mateuspinheiro.umbriel+235789&rsquo;s workspace</span>
      </h1>
      <p class="lede">
        Your space is provisioned and ready. From here you can connect data sources, compose workflows, and ship agents into production — all on the same canvas.
      </p>
    </section>

    <footer>
      <span>Est. Today</span>
      <span class="rule" aria-hidden="true"></span>
      <span>Machina</span>
    </footer>
  </main>
</body>
</html>
