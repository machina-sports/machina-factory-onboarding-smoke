<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Nexus Sports</title>
  <style>
    :root {
      --ink: #0e1116;
      --ink-soft: #4a5361;
      --accent: #d64545;
      --line: rgba(14, 17, 22, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 12% -10%, #fdeede 0%, rgba(253, 238, 222, 0) 55%),
        radial-gradient(1000px 700px at 100% 110%, #e6ecf6 0%, rgba(230, 236, 246, 0) 55%),
        linear-gradient(180deg, #fcfbf9 0%, #f4f2ee 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 6rem);
    }

    main {
      max-width: 46rem;
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    h1 .accent { color: var(--accent); font-style: italic; }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 34rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    .rule {
      width: 3.5rem;
      height: 2px;
      background: var(--ink);
      margin: 2.5rem 0;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    footer {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      padding: 1.5rem clamp(1.5rem, 6vw, 6rem);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .eyebrow, .lede { opacity: 1; transform: none; animation: none; }
      .rule { transform: scaleX(1); animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main>
      <p class="eyebrow">Onboarding</p>
      <h1>Welcome to<br><span class="accent">Nexus Sports</span></h1>
      <div class="rule"></div>
      <p class="lede">Your home for the moments that matter — scores, stories, and the signal beneath the noise. Everything starts here.</p>
    </main>
  </div>
  <footer>
    <span>NEXUS SPORTS</span>
    <span>SMOKE TEST · READY</span>
  </footer>
</body>
</html>
