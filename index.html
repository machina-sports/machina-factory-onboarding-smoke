<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Machina Drops</title>
  <meta name="description" content="Welcome to Machina Drops.">
  <style>
    :root {
      --paper: oklch(97.5% 0.008 85);
      --paper-deep: oklch(93% 0.018 70);
      --ink: oklch(20% 0.01 60);
      --ink-soft: oklch(42% 0.012 60);
      --accent: oklch(58% 0.16 35);
      --display: "Bodoni 72", "Didot", "Bodoni MT", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --text: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--text);
      background:
        radial-gradient(120% 80% at 100% 0%, oklch(90% 0.04 45 / 0.55), transparent 60%),
        radial-gradient(90% 70% at 0% 100%, oklch(92% 0.03 95 / 0.6), transparent 65%),
        linear-gradient(170deg, var(--paper) 0%, var(--paper-deep) 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.25rem, 4vw, 3.5rem);
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--ink); }

    .rule {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding-bottom: 0.9rem;
      border-bottom: 1px solid oklch(20% 0.01 60 / 0.18);
    }

    main {
      align-self: center;
      max-width: 62rem;
      padding-block: clamp(3rem, 12vh, 8rem);
      display: grid;
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }

    .kicker {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(3.2rem, 11vw, 9rem);
      line-height: 0.92;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .lede {
      max-width: 34rem;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      line-height: 1.6;
      color: var(--ink-soft);
      text-wrap: pretty;
    }

    footer {
      padding-top: 0.9rem;
      border-top: 1px solid oklch(20% 0.01 60 / 0.18);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    @media (prefers-reduced-motion: no-preference) {
      .reveal { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
      .reveal:nth-child(2) { animation-delay: 0.12s; }
      .reveal:nth-child(3) { animation-delay: 0.26s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
      }
    }
  </style>
</head>
<body>
  <header class="rule">
    <span>Machina Drops</span>
    <span>No. 001</span>
  </header>

  <main>
    <p class="kicker reveal">Onboarding</p>
    <h1 class="reveal">Welcome to <em>Machina</em> Drops</h1>
    <p class="lede reveal">You're in. This is where new drops land first — quiet, considered, and ready when you are.</p>
  </main>

  <footer>Machina</footer>
</body>
</html>
