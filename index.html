<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Eugenio's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b625a;
      --accent: #b4532a;
      --paper: #f7f3ee;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      color: #14110f;
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(180, 83, 42, 0.14), transparent 60%),
        radial-gradient(900px 500px at 0% 110%, rgba(58, 90, 120, 0.12), transparent 55%),
        linear-gradient(160deg, #faf7f2 0%, #f2ece3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      overflow-x: hidden;
    }

    main {
      max-width: 46rem;
      width: 100%;
    }

    .eyebrow {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.25rem);
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 2.25rem;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
      transform: translateY(-0.15em);
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      color: var(--ink);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.24s forwards;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin-top: clamp(1.5rem, 4vw, 2.25rem);
      max-width: 34rem;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.65;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.4s forwards;
    }

    .rule {
      margin-top: clamp(2.5rem, 6vw, 4rem);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.56s forwards;
    }

    .rule::before {
      content: "";
      flex: 0 0 3.5rem;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow,
      h1,
      p.lede,
      .rule {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="accent">Eugenio&rsquo;s</span> workspace</h1>
    <p class="lede">
      A quiet place to build. Everything is set up and ready &mdash; take a look
      around, and let&rsquo;s make something worth shipping.
    </p>
    <div class="rule">Ready when you are</div>
  </main>
</body>
</html>
