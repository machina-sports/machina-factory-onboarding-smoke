<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Acme Sports Media Brazil Group</title>
  <style>
    :root {
      --ink: #0e1116;
      --muted: #5b6472;
      --accent: #0a5f3c;
      --accent-2: #d8b24a;
      --bg-1: #f6f8f5;
      --bg-2: #eef1f6;
      --bg-3: #f9f5ec;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", "Iowan Old Style", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, var(--bg-3), transparent 60%),
        radial-gradient(1000px 700px at 100% 0%, var(--bg-2), transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    main {
      max-width: 820px;
      width: 100%;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(0.68rem, 1.4vw, 0.78rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.7s ease forwards 0.1s;
    }

    .eyebrow::before {
      content: "";
      width: 2.2rem;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    h1 {
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
      opacity: 0;
      animation: rise 0.8s ease forwards 0.25s;
    }

    h1 .accent {
      font-style: italic;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 54ch;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.4s;
    }

    .rule {
      margin-top: clamp(2.25rem, 5vw, 3.25rem);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s ease forwards 0.55s;
    }

    .rule .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(14,17,22,0.18), transparent);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .lede, .rule { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding · Acme Sports Media</p>
    <h1>Welcome to Acme Sports Media <span class="accent">Brazil Group</span></h1>
    <p class="lede">Your workspace is live and ready. This is the starting line for everything we'll build together.</p>
    <div class="rule">
      <span class="dot"></span>
      <span>Brazil Group</span>
      <span class="line"></span>
    </div>
  </main>
</body>
</html>
