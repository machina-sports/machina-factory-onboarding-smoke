<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to FQA 2014</title>
  <style>
    :root {
      --ink: #14131a;
      --muted: #6a6778;
      --accent: #5b4bff;
      --line: rgba(20, 19, 26, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #eef0ff 0%, rgba(238, 240, 255, 0) 60%),
        radial-gradient(1000px 500px at 110% 110%, #fdeef6 0%, rgba(253, 238, 246, 0) 55%),
        linear-gradient(180deg, #fbfbfd 0%, #f4f5f9 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7vw 6vw;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      width: 100%;
      max-width: 720px;
    }

    .eyebrow {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.1s;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.8rem, 10vw, 6rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.22s;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 48ch;
      margin-bottom: 3rem;
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.34s;
    }

    .footer {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 1.6rem;
      border-top: 1px solid var(--line);
      opacity: 0;
      animation: rise 0.9s ease forwards;
      animation-delay: 0.46s;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(91, 75, 255, 0.14);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="eyebrow">Onboarding</div>
    <h1>Welcome to <span class="accent">FQA&nbsp;2014</span></h1>
    <p class="lede">
      You're all set. This is your starting point — clean, quiet, and ready
      for whatever comes next.
    </p>
    <div class="footer">
      <span class="dot"></span>
      <span>System online</span>
    </div>
  </main>
</body>
</html>
