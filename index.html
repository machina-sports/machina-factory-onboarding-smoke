<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Armando's workspace</title>
  <style>
    :root {
      --ink: #0c0d10;
      --muted: #5a5f6b;
      --line: rgba(12, 13, 16, 0.08);
      --accent: #3a4cff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 12% 8%, rgba(58, 76, 255, 0.10) 0%, transparent 55%),
        radial-gradient(110% 90% at 92% 100%, rgba(255, 138, 76, 0.10) 0%, transparent 55%),
        linear-gradient(180deg, #fbfbf9 0%, #f4f3ee 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 6vw, 5rem);
    }

    /* Header / eyebrow */
    .top {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 0.7s ease both;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(58, 76, 255, 0.14);
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      gap: clamp(1.25rem, 3vw, 2rem);
      padding: clamp(3rem, 10vw, 6rem) 0;
    }

    .kicker {
      font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      animation: rise 0.7s ease 0.1s both;
    }

    h1 {
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.02em;
      font-size: clamp(2.75rem, 9vw, 6.5rem);
      max-width: 16ch;
      animation: rise 0.8s ease 0.18s both;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 46ch;
      animation: rise 0.8s ease 0.28s both;
    }

    /* Footer */
    .bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--line);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      animation: rise 0.8s ease 0.4s both;
    }

    .bottom .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2bbd6e;
      box-shadow: 0 0 0 0 rgba(43, 189, 110, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(43, 189, 110, 0.5); }
      70%  { box-shadow: 0 0 0 8px rgba(43, 189, 110, 0); }
      100% { box-shadow: 0 0 0 0 rgba(43, 189, 110, 0); }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <span class="dot"></span>
      <span>Workspace</span>
    </div>

    <main class="hero">
      <p class="kicker">Welcome aboard</p>
      <h1>Welcome to <span class="accent">Armando's</span> workspace</h1>
      <p class="lede">
        Everything's wired up and ready to go. This is your starting point —
        clean, calm, and waiting for the first move.
      </p>
    </main>

    <footer class="bottom">
      <span class="status"><span class="pulse"></span>System online</span>
      <span>Onboarding · smoke test</span>
    </footer>
  </div>
</body>
</html>
