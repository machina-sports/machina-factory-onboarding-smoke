<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Darwin QA Sports Lab</title>
  <style>
    :root {
      --ink: #14161a;
      --muted: #5b6472;
      --line: rgba(20, 22, 26, 0.08);
      --accent: #2f5bff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(47, 91, 255, 0.10), transparent 60%),
        radial-gradient(1000px 700px at 100% 110%, rgba(255, 138, 76, 0.10), transparent 55%),
        linear-gradient(180deg, #fbfbfd 0%, #f3f4f8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      flex: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 5vw, 3rem);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    header .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(47, 91, 255, 0.14);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(3rem, 8vw, 6rem) 0;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.7s ease forwards 0.1s;
    }

    h1 {
      font-size: clamp(2.75rem, 9vw, 5.75rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      max-width: 14ch;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.22s;
    }

    h1 .lab {
      display: block;
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.7;
      color: var(--muted);
      max-width: 46ch;
      margin-top: 2rem;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.36s;
    }

    .rule {
      height: 1px;
      background: var(--line);
      margin: 2.75rem 0;
      max-width: 240px;
      opacity: 0;
      animation: fade 0.9s ease forwards 0.5s;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      opacity: 0;
      animation: fade 0.9s ease forwards 0.6s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <span class="dot" aria-hidden="true"></span>
      Darwin QA
    </header>

    <main>
      <p class="eyebrow">Onboarding · Smoke Test</p>
      <h1>Welcome to Darwin QA<span class="lab">Sports Lab</span></h1>
      <p class="lede">
        A quiet place to verify the pipeline end to end — from the first
        deploy to the last check. If you can read this, the lights are on.
      </p>
      <div class="rule" aria-hidden="true"></div>
    </main>

    <footer>
      <span>Sports Lab · Quality Assurance</span>
      <span>Status: Ready</span>
    </footer>
  </div>
</body>
</html>
