<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to joshshargo's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b625a;
      --accent: #b5452e;
      --paper: #f6f2ec;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, #fbf7f0 0%, rgba(251,247,240,0) 55%),
        radial-gradient(900px 700px at 110% 10%, #f0e7da 0%, rgba(240,231,218,0) 60%),
        linear-gradient(160deg, #f7f3ed 0%, #efe6d9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 6rem);
      overflow-x: hidden;
    }

    main {
      max-width: 60ch;
      width: 100%;
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .eyebrow {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      animation: rise 900ms 80ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      font-weight: 700;
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
      animation: rise 900ms 160ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 .name {
      font-style: italic;
      color: var(--accent);
    }

    .rule {
      width: 4.5rem;
      height: 3px;
      background: var(--ink);
      margin: 0 0 clamp(1.25rem, 3vw, 2rem);
      animation: grow 900ms 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    p {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.65;
      color: var(--muted);
      max-width: 46ch;
      animation: rise 900ms 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); transform-origin: left; }
      to   { opacity: 1; transform: scaleX(1); transform-origin: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .eyebrow, h1, .rule, p { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="name">joshshargo's</span> workspace</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Everything is set up and ready to go. This is your starting point — a quiet, clean space to build from.</p>
  </main>
</body>
</html>
