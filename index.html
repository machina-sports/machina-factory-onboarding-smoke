<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to r10-tyltyhub</title>
  <style>
    :root {
      --ink: #0a0a0a;
      --ink-soft: #4a4a52;
      --paper: #f6f3ee;
      --accent: #d94f2a;
      --rule: rgba(10, 10, 10, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body {
      font-family: "Times New Roman", "Iowan Old Style", "Georgia", "Cambria", serif;
      color: var(--ink);
      background: var(--paper);
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(217, 79, 42, 0.10), transparent 60%),
        radial-gradient(ellipse 70% 60% at 100% 100%, rgba(31, 41, 90, 0.10), transparent 60%),
        linear-gradient(180deg, #f8f5f0 0%, #f1ece3 100%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .frame {
      flex: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 64px);
      gap: clamp(48px, 8vw, 96px);
    }

    /* ── Masthead ─────────────────────────────── */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--rule);
      font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .masthead .mark {
      font-weight: 600;
      color: var(--ink);
    }

    .masthead .meta {
      display: flex;
      gap: 24px;
    }

    .masthead .meta span::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
      transform: translateY(-1px);
    }

    /* ── Hero ─────────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      gap: clamp(28px, 4vw, 44px);
      padding: clamp(24px, 6vw, 80px) 0;
    }

    .eyebrow {
      font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }

    .eyebrow::after {
      content: "";
      height: 1px;
      width: 56px;
      background: var(--accent);
      opacity: 0.6;
    }

    h1.headline {
      margin: 0;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(48px, 11vw, 156px);
      line-height: 0.92;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 14ch;
    }

    h1.headline .accent {
      font-style: normal;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--ink);
    }

    h1.headline .accent em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    .deck {
      max-width: 56ch;
      font-size: clamp(17px, 1.6vw, 20px);
      line-height: 1.55;
      color: var(--ink-soft);
      margin: 0;
    }

    .deck::before {
      content: "";
      display: block;
      width: 36px;
      height: 2px;
      background: var(--ink);
      margin-bottom: 22px;
    }

    /* ── Colophon ─────────────────────────────── */
    .colophon {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .colophon .num {
      font-family: "Times New Roman", Georgia, serif;
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
    }

    /* ── Entrance ─────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    .r1 { animation-delay: 80ms; }
    .r2 { animation-delay: 220ms; }
    .r3 { animation-delay: 420ms; }
    .r4 { animation-delay: 640ms; }
    .r5 { animation-delay: 820ms; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 540px) {
      .masthead .meta { gap: 14px; }
      .masthead .meta .hide-sm { display: none; }
      .deck::before { margin-bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <header class="masthead reveal r1">
      <div class="mark">r10 · tyltyhub</div>
      <div class="meta">
        <span>Onboarding</span>
        <span class="hide-sm">Vol. 01</span>
      </div>
    </header>

    <section class="hero">
      <span class="eyebrow reveal r2">A new chapter begins</span>
      <h1 class="headline reveal r3">
        Welcome to <span class="accent">r10<em>‑</em>tyltyhub</span>.
      </h1>
      <p class="deck reveal r4">
        The smoke test is lit. Your workspace is wired up, the runway is clear, and everything from here on is yours to build. Take a breath — then make something worth shipping.
      </p>
    </section>

    <footer class="colophon reveal r5">
      <span>Made with intent</span>
      <span class="num">№ 001</span>
      <span>Issue · Onboarding</span>
    </footer>
  </main>
</body>
</html>
