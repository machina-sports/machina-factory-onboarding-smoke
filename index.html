<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome — mateuspinheiro.umbriel+37243</title>
<style>
  :root {
    --ink: #11131a;
    --ink-soft: #4a4d5c;
    --paper: #f6f3ec;
    --accent: #d94f2b;
    --rule: rgba(17, 19, 26, 0.12);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", "Georgia", "Times New Roman", serif;
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(1100px 700px at 12% -10%, #f9e9d5 0%, rgba(249, 233, 213, 0) 60%),
      radial-gradient(900px 600px at 92% 110%, #e6dcc8 0%, rgba(230, 220, 200, 0) 55%),
      linear-gradient(180deg, #f8f5ee 0%, #efeadc 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .page {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 1180px;
    width: 100%;
    margin: 0 auto;
    padding: 32px 40px 48px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
    font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .mark {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    color: var(--ink);
    font-weight: 600;
  }

  .mark::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    background: var(--accent);
    transform: translateY(1px);
  }

  .meta { display: flex; gap: 22px; }
  .meta span::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--ink-soft);
    border-radius: 50%;
    margin-right: 10px;
    transform: translateY(-3px);
  }

  main.hero {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    align-content: center;
    padding: 80px 0 60px;
  }

  .eyebrow {
    font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .eyebrow::after {
    content: "";
    width: 56px;
    height: 1px;
    background: var(--accent);
    display: inline-block;
  }

  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(44px, 8.4vw, 124px);
    line-height: 0.96;
    letter-spacing: -0.025em;
    max-width: 18ch;
  }

  h1 .accent {
    font-style: italic;
    color: var(--accent);
  }

  h1 .workspace {
    display: block;
    font-size: 0.42em;
    line-height: 1.1;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin-top: 22px;
    font-style: normal;
  }

  .lede {
    margin: 44px 0 0;
    max-width: 52ch;
    font-size: clamp(16px, 1.4vw, 19px);
    line-height: 1.55;
    color: var(--ink-soft);
  }

  footer.bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--rule);
    font-family: "Helvetica Neue", "Inter", system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .folio {
    font-family: "Iowan Old Style", Georgia, serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
  }

  @media (max-width: 640px) {
    .page { padding: 22px 22px 28px; }
    header.top { font-size: 10px; }
    .meta { display: none; }
    main.hero { padding: 48px 0 40px; }
    .lede { margin-top: 32px; }
    footer.bottom { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="top">
      <span class="mark">Machina&nbsp;/&nbsp;Factory</span>
      <nav class="meta" aria-label="Status">
        <span>Onboarding</span>
        <span>Vol. 01</span>
        <span>Smoke Test</span>
      </nav>
    </header>

    <main class="hero">
      <span class="eyebrow">New workspace</span>
      <h1>
        Welcome <span class="accent">to</span>
        <span class="workspace">mateuspinheiro.umbriel+37243's workspace</span>
      </h1>
      <p class="lede">
        A quiet place to think out loud, sketch agents, and ship the next idea.
        Your environment is provisioned and ready — start whenever you are.
      </p>
    </main>

    <footer class="bottom">
      <span>Provisioned&nbsp;·&nbsp;Ready</span>
      <span class="folio">Edition i</span>
      <span>machina.gg</span>
    </footer>
  </div>
</body>
</html>
