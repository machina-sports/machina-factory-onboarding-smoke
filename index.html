<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome · Acme Sports Media Brazil Group</title>
  <style>
    :root {
      --ink: #0e1116;
      --muted: #5b6472;
      --accent: #16a34a;
      --accent-deep: #065f46;
      --bg-top: #f6f8fb;
      --bg-bottom: #eef2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(22,163,74,0.10), transparent 60%),
        radial-gradient(900px 500px at 100% 110%, rgba(6,95,70,0.08), transparent 55%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .card {
      max-width: 720px;
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: rise 0.7s ease 0.05s forwards;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.8s ease 0.18s forwards;
    }

    h1 .accent {
      color: var(--accent-deep);
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .rule {
      width: 64px;
      height: 3px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      border-radius: 3px;
      opacity: 0;
      animation: grow 0.7s ease 0.34s forwards;
      transform-origin: center;
    }

    p.lede {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 42ch;
      margin: 0 auto;
      opacity: 0;
      animation: rise 0.8s ease 0.48s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .rule, p.lede { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="accent">Acme Sports Media Brazil Group</span></h1>
    <div class="rule"></div>
    <p class="lede">Your workspace is ready. This is the start of something built for the pace of sport.</p>
  </main>
</body>
</html>
