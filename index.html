<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Cost Review Smoke Test</title>
  <style>
    :root {
      --paper: oklch(97.5% 0.008 85);
      --paper-deep: oklch(93% 0.02 70);
      --ink: oklch(18% 0.01 60);
      --muted: oklch(45% 0.015 60);
      --accent: oklch(55% 0.16 35);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(2rem, 8vw, 8rem) clamp(1.5rem, 8vw, 10rem);
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 100% 0%, var(--paper-deep) 0%, transparent 60%),
        linear-gradient(180deg, var(--paper) 0%, oklch(95% 0.012 75) 100%);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      overflow-x: hidden;
    }
    a { color: var(--accent); }
    a:hover { color: var(--ink); }
    main {
      width: 100%;
      max-width: 62rem;
      display: grid;
      gap: clamp(1.5rem, 4vw, 2.5rem);
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font: 600 0.75rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .kicker::before {
      content: "";
      width: 2.5rem;
      height: 2px;
      background: var(--accent);
    }
    h1 {
      font-weight: 700;
      font-size: clamp(2.75rem, 9vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    p {
      max-width: 34rem;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.6;
      color: var(--muted);
      text-wrap: pretty;
    }
    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise 0.8s cubic-bezier(.2,.7,.2,1) both; }
      main > :nth-child(2) { animation-delay: 0.12s; }
      main > :nth-child(3) { animation-delay: 0.24s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    }
  </style>
</head>
<body>
  <main>
    <span class="kicker">Onboarding</span>
    <h1>Welcome to <em>Cost Review</em> Smoke Test</h1>
    <p>Everything is wired up and running. This page confirms the deploy pipeline is healthy.</p>
  </main>
</body>
</html>
