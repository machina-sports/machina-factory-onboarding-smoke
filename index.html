<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome to Armando's workspace</title>
  <style>
    :root {
      --ink: #16130f;
      --muted: #6b6358;
      --line: rgba(22, 19, 15, 0.12);
      --accent: #b4451f;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, #fbf4e6 0%, rgba(251, 244, 230, 0) 55%),
        radial-gradient(110% 100% at 88% 96%, #f1e3d3 0%, rgba(241, 227, 211, 0) 50%),
        linear-gradient(165deg, #fdf8f0 0%, #f4ead9 100%);
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      max-width: 760px;
    }

    .eyebrow {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: rise 0.7s ease-out 0.05s forwards;
    }

    .rule {
      width: 52px;
      height: 2px;
      margin: 1.4rem 0 2rem;
      background: var(--ink);
      transform-origin: left center;
      transform: scaleX(0);
      animation: grow 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.6rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      margin-top: 1.8rem;
      max-width: 46ch;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.7;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    footer {
      margin-top: 3rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--line);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease-out 0.65s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, .rule, h1, p.lede, footer {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding · Smoke Test</p>
    <div class="rule" aria-hidden="true"></div>
    <h1>Welcome to<br><span class="accent">Armando's</span> workspace</h1>
    <p class="lede">
      Everything's wired up and running. This is your starting point —
      a quiet, clean space ready for whatever you build next.
    </p>
    <footer>Machina · ready when you are</footer>
  </main>
</body>
</html>
