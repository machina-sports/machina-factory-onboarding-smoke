<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to dog's workspace</title>
  <style>
    :root {
      --ink: #161412;
      --muted: #6b6660;
      --accent: #c2410c;
      --bg-1: #faf7f2;
      --bg-2: #f0ebe2;
      --bg-3: #e8e0d2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      color: var(--ink);
      background:
        radial-gradient(120% 90% at 12% 8%, var(--bg-1) 0%, transparent 55%),
        radial-gradient(140% 110% at 88% 94%, var(--bg-3) 0%, transparent 50%),
        linear-gradient(160deg, var(--bg-2) 0%, var(--bg-1) 50%, var(--bg-2) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 720px;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 2.2rem;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
      transform: translateY(-0.15em);
    }

    h1 {
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2rem);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
    }

    .rule {
      margin-top: clamp(2.5rem, 6vw, 4rem);
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    .rule .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(0,0,0,0.18), transparent);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, p.lede, .rule { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to <span class="accent">dog&rsquo;s</span> workspace</h1>
    <p class="lede">Everything is set up and ready. This is your starting point &mdash; clean, quiet, and waiting for whatever you build next.</p>
    <div class="rule">
      <span>Ready</span>
      <span class="line"></span>
    </div>
  </main>
</body>
</html>
