<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to ENTAIN Organization</title>
  <style>
    :root {
      --ink: #0e1116;
      --muted: #5b6472;
      --accent: #2f5bea;
      --bg-1: #f6f8fc;
      --bg-2: #eef1f8;
      --bg-3: #e7ecfb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: Georgia, "Times New Roman", "Iowan Old Style", serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 700px at 12% -10%, var(--bg-3), transparent 55%),
        radial-gradient(900px 600px at 100% 110%, var(--bg-2), transparent 50%),
        linear-gradient(180deg, var(--bg-1), #ffffff 70%);
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      max-width: 880px;
      text-align: left;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: rise 0.7s ease 0.05s forwards;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--accent);
      vertical-align: middle;
      margin-right: 0.9rem;
    }

    h1 {
      margin-top: 1.4rem;
      font-size: clamp(2.6rem, 8.5vw, 5.6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: rise 0.8s ease 0.18s forwards;
    }

    h1 .accent {
      display: block;
      color: var(--accent);
    }

    .lede {
      margin-top: 1.8rem;
      max-width: 46ch;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.65;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.8s ease 0.32s forwards;
    }

    .rule {
      margin-top: 2.6rem;
      width: 64px;
      height: 3px;
      background: var(--ink);
      border-radius: 2px;
      opacity: 0;
      animation: rise 0.8s ease 0.46s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .lede, .rule { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding</p>
    <h1>Welcome to<span class="accent">ENTAIN Organization</span></h1>
    <p class="lede">Your workspace is ready. This is where data, content, and intelligence come together — start building something worth shipping.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
