<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Machina Drops</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6258;
      --accent: #c2410c;
      --line: rgba(20, 17, 15, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #fbe9dd 0%, rgba(251, 233, 221, 0) 55%),
        radial-gradient(1000px 700px at 110% 120%, #e7ecf3 0%, rgba(231, 236, 243, 0) 50%),
        linear-gradient(160deg, #fdfbf8 0%, #f4f1ec 100%);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 6vw, 4rem);
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.14);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2.5rem, 8vw, 6rem) 0;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: rise 0.8s ease forwards 0.1s;
    }

    h1 {
      font-size: clamp(2.8rem, 11vw, 6rem);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -0.02em;
      max-width: 14ch;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.25s;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      margin-top: 2rem;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.45s;
    }

    .rule {
      height: 1px;
      background: var(--line);
      margin: clamp(2.5rem, 6vw, 4rem) 0 1.5rem;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 1s ease forwards 0.6s;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease forwards 0.75s;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <span class="mark" aria-hidden="true"></span>
      Machina
    </header>

    <main>
      <p class="eyebrow">Onboarding</p>
      <h1>Welcome to <em>Machina Drops</em></h1>
      <p class="lede">
        Your space for fresh sports content, delivered the moment it matters.
        Everything starts here.
      </p>
      <div class="rule" aria-hidden="true"></div>
      <footer>
        <span>Smoke Test</span>
        <span>v1.0</span>
      </footer>
    </main>
  </div>
</body>
</html>
