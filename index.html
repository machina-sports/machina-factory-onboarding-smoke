<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to FQA 2003</title>
  <style>
    :root {
      --ink: #14121a;
      --muted: #6b6676;
      --accent: #5b3df5;
      --line: rgba(20, 18, 26, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100svh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 700px at 15% -10%, #efeaff 0%, transparent 55%),
        radial-gradient(900px 700px at 100% 110%, #ffeef4 0%, transparent 55%),
        linear-gradient(180deg, #fbfaff 0%, #f4f2fb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 5rem);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 48rem;
      width: 100%;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
    }

    .eyebrow::before {
      content: "";
      width: 2.5rem;
      height: 1px;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-size: clamp(2.75rem, 10vw, 6rem);
      line-height: 0.98;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
    }

    h1 .year {
      font-style: italic;
      color: var(--accent);
    }

    p.lead {
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
    }

    footer {
      margin-top: clamp(2.5rem, 6vw, 4rem);
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Onboarding</span>
    <h1>Welcome to <br />FQA <span class="year">2003</span></h1>
    <p class="lead">You're all set. This is a minimal, dependency-free onboarding
      screen — proof the pipeline runs clean from first commit to deploy.</p>
    <footer>FQA 2003 &middot; Smoke test build</footer>
  </main>
</body>
</html>
