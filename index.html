<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome to Fanatics</title>
  <style>
    :root {
      --ink: #0b0b0f;
      --muted: #55555f;
      --accent: #d0021b;
      --line: rgba(11, 11, 15, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(208, 2, 27, 0.10), transparent 60%),
        radial-gradient(1000px 700px at 100% 110%, rgba(20, 30, 80, 0.10), transparent 55%),
        linear-gradient(180deg, #fbfbf9 0%, #f3f2ee 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(1.5rem, 4vw, 3.5rem);
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .brand {
      font-weight: 700;
      color: var(--ink);
    }

    .brand::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 0.7rem;
      background: var(--accent);
      border-radius: 50%;
      vertical-align: middle;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      padding: clamp(3rem, 10vh, 7rem) 0;
      animation: rise 0.9s ease both;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.32em;
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
      animation: rise 0.9s ease 0.1s both;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 8.5rem);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      animation: rise 0.9s ease 0.2s both;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .lede {
      font-size: clamp(1.05rem, 2.4vw, 1.5rem);
      line-height: 1.55;
      color: var(--muted);
      max-width: 34ch;
      animation: rise 0.9s ease 0.3s both;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      animation: rise 0.9s ease 0.4s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .topbar .meta { display: none; }
      .footer { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <span class="brand">Fanatics</span>
      <span class="meta">Onboarding</span>
    </header>

    <main class="hero">
      <p class="eyebrow">You're in</p>
      <h1>Welcome to <em>Fanatics</em></h1>
      <p class="lede">Everything you need to get started, all in one place. Let's set things up.</p>
    </main>

    <footer class="footer">
      <span>&copy; Fanatics</span>
      <span>Smoke test &middot; v1</span>
    </footer>
  </div>
</body>
</html>
