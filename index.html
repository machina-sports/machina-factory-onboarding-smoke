<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to FQA 2006</title>
  <style>
    :root {
      --ink: #14130f;
      --muted: #6b6558;
      --line: rgba(20, 19, 15, 0.12);
      --accent: #b4532a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7vw 6vw;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(1200px 700px at 78% -10%, #f7ede0 0%, rgba(247, 237, 224, 0) 55%),
        radial-gradient(900px 600px at 0% 110%, #efe7f2 0%, rgba(239, 231, 242, 0) 50%),
        linear-gradient(170deg, #fbf9f4 0%, #f4f1ea 100%);
      overflow-x: hidden;
    }

    .stage {
      width: 100%;
      max-width: 720px;
    }

    .eyebrow {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s forwards;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.8rem, 10vw, 6.2rem);
      line-height: 0.98;
      letter-spacing: -0.02em;
      margin-bottom: 1.6rem;
    }

    h1 .line {
      display: block;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.95s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    h1 .line:nth-child(1) { animation-delay: 0.22s; }
    h1 .line:nth-child(2) { animation-delay: 0.36s; }

    h1 .year {
      color: var(--accent);
      font-style: italic;
    }

    .lede {
      font-size: clamp(1.02rem, 2.4vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 48ch;
      margin-bottom: 2.6rem;
      opacity: 0;
      animation: rise 0.95s cubic-bezier(0.2, 0.7, 0.2, 1) 0.5s forwards;
    }

    .rule {
      height: 1px;
      width: 100%;
      background: var(--line);
      margin-bottom: 1.4rem;
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.62s forwards;
    }

    .meta {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: rise 0.95s cubic-bezier(0.2, 0.7, 0.2, 1) 0.74s forwards;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes grow {
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .eyebrow, .lede, .meta { opacity: 1; }
      h1 .line { opacity: 1; transform: none; }
      .rule { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow">Onboarding &middot; Smoke Test</p>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line">FQA <span class="year">2006</span></span>
    </h1>
    <p class="lede">
      A quiet place to begin. If you can read this, the pipeline is live and
      everything downstream is working as intended.
    </p>
    <div class="rule"></div>
    <p class="meta">
      <span>Status: Ready</span>
      <span class="dot"></span>
      <span>Single file</span>
      <span class="dot"></span>
      <span>No dependencies</span>
    </p>
  </main>
</body>
</html>
