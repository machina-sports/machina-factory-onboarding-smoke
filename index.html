<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome — mateuspinheiro.umbriel+121212</title>
<style>
  :root {
    --ink: #11131a;
    --ink-soft: #4a4f5c;
    --rule: rgba(17, 19, 26, 0.12);
    --accent: #b0411b;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: "Iowan Old Style", "Palatino Linotype", "Palatino", "Georgia", serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 12% 8%, #f6e4d0 0%, transparent 60%),
      radial-gradient(900px 600px at 88% 92%, #e3dcf2 0%, transparent 55%),
      linear-gradient(180deg, #fbf7f1 0%, #f3eee6 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    flex-direction: column;
  }

  .page {
    flex: 1;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(28px, 5vw, 56px) clamp(22px, 5vw, 64px);
    display: flex;
    flex-direction: column;
    gap: clamp(48px, 10vh, 96px);
  }

  header.masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
    font-family: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
  }

  .mark .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(176, 65, 27, 0.12);
  }

  .meta { opacity: 0.75; }

  main.hero {
    display: flex;
    flex-direction: column;
    gap: 28px;
    padding: clamp(8px, 4vw, 24px) 0;
  }

  .eyebrow {
    font-family: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  .eyebrow::before {
    content: "";
    width: 28px;
    height: 1px;
    background: currentColor;
    display: inline-block;
  }

  h1 {
    margin: 0;
    font-weight: 600;
    font-size: clamp(40px, 7.5vw, 96px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    max-width: 18ch;
  }

  h1 .accent {
    font-style: italic;
    color: var(--accent);
    font-weight: 500;
  }

  h1 .handle {
    display: inline-block;
    word-break: break-word;
  }

  .lede {
    max-width: 56ch;
    font-size: clamp(17px, 1.6vw, 20px);
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: var(--ink);
    opacity: 0.4;
    margin-top: 8px;
  }

  footer.colophon {
    margin-top: auto;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    font-family: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  footer .pulse {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  footer .pulse .ping {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #2e7d4f;
    box-shadow: 0 0 0 0 rgba(46, 125, 79, 0.6);
    animation: ping 2.2s ease-out infinite;
  }

  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(46, 125, 79, 0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(46, 125, 79, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 125, 79, 0); }
  }

  @media (max-width: 520px) {
    header.masthead { font-size: 10px; }
    footer.colophon { flex-direction: column; align-items: flex-start; gap: 10px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <span class="mark"><span class="dot"></span>Machina · Workspace</span>
      <span class="meta">Onboarding · v1</span>
    </header>

    <main class="hero">
      <span class="eyebrow">Welcome aboard</span>
      <h1>
        Welcome to <span class="accent">mateuspinheiro.umbriel+121212</span>'s <span class="handle">workspace</span>.
      </h1>
      <div class="rule"></div>
      <p class="lede">
        This is a quiet starting point — a single page, no dependencies, no clutter. From here, the workspace is yours to shape: connect data, compose agents, ship workflows.
      </p>
    </main>

    <footer class="colophon">
      <span>Index · 001</span>
      <span class="pulse"><span class="ping"></span>Ready</span>
    </footer>
  </div>
</body>
</html>
