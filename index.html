<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to 178797777's workspace</title>
  <style>
    :root {
      --ink: #14110f;
      --muted: #6b6258;
      --line: rgba(20, 17, 15, 0.12);
      --accent: #c2410c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 4rem);
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(120% 120% at 0% 0%, #fbf4ea 0%, transparent 55%),
        radial-gradient(120% 120% at 100% 100%, #f3ece2 0%, transparent 50%),
        linear-gradient(160deg, #fdfaf5 0%, #f4ede3 100%);
      overflow-x: hidden;
    }

    main {
      width: 100%;
      max-width: 56rem;
      text-align: left;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
      opacity: 0;
      animation: rise 0.8s ease forwards;
    }

    .eyebrow::before {
      content: "";
      width: 2.2rem;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.6rem, 9vw, 6rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.25rem, 3vw, 2rem);
    }

    h1 .line {
      display: block;
      opacity: 0;
      animation: rise 0.9s ease forwards;
    }

    h1 .line:nth-child(1) { animation-delay: 0.1s; }
    h1 .line:nth-child(2) { animation-delay: 0.22s; }
    h1 .line:nth-child(3) { animation-delay: 0.34s; }

    h1 .accent {
      font-style: italic;
      color: var(--accent);
    }

    p.lede {
      font-size: clamp(1.05rem, 2.2vw, 1.3rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 38ch;
      opacity: 0;
      animation: rise 0.9s ease 0.46s forwards;
    }

    footer {
      margin-top: clamp(2.5rem, 6vw, 4rem);
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease 0.6s forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1 .line, p.lede, footer { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Onboarding</span>
    <h1>
      <span class="line">Welcome to</span>
      <span class="line accent">178797777's</span>
      <span class="line">workspace</span>
    </h1>
    <p class="lede">Everything is set up and ready. This is your starting point — clean, quiet, and waiting for what you build next.</p>
    <footer>Machina &middot; Workspace ready</footer>
  </main>
</body>
</html>
